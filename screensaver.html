<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Icosahedron Effect</title>
<meta name="robots" content="noindex">
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#143023;cursor:none;font-family:Inter,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
  #bg{position:fixed;inset:0;animation:shift 40s ease-in-out infinite alternate;
      background:radial-gradient(ellipse at 30% 30%,#1e4630 0%,#143023 55%,#0b1f16 100%)}
  @keyframes shift{
    0%{filter:hue-rotate(0deg) brightness(1)}
    50%{filter:hue-rotate(18deg) brightness(1.15)}
    100%{filter:hue-rotate(-14deg) brightness(.95)}
  }
  canvas{position:fixed;inset:0;width:100%;height:100%}
  #name{position:fixed;left:0;top:0;text-align:center;color:#62d860;white-space:nowrap;will-change:transform;user-select:none}
  #name h1{margin:0;font-size:clamp(28px,5.2vw,84px);font-weight:800;letter-spacing:-.01em;line-height:1.05}
  #name p{margin:.35em 0 0;font-size:clamp(14px,1.8vw,28px);color:#eaf7d5;opacity:.9}
  #hint{position:fixed;bottom:14px;left:0;right:0;text-align:center;color:#b7d99a;font-size:14px;opacity:.7;transition:opacity 1.5s}
</style>
</head>
<body>
<div id="bg"></div>
<canvas id="c"></canvas>
<div id="name"><h1>The Icosahedron Effect</h1><p>driana.org</p></div>
<div id="hint">Click or press F to go full screen &middot; Esc to exit</div>
<script>
// Rotating wireframe icosahedron (soft, behind the title)
const cv=document.getElementById("c"),cx=cv.getContext("2d");
function fit(){cv.width=innerWidth*devicePixelRatio;cv.height=innerHeight*devicePixelRatio}
fit();addEventListener("resize",fit);
const t=(1+Math.sqrt(5))/2;
let V=[[-1,t,0],[1,t,0],[-1,-t,0],[1,-t,0],[0,-1,t],[0,1,t],[0,-1,-t],[0,1,-t],[t,0,-1],[t,0,1],[-t,0,-1],[-t,0,1]];
const E=[];for(let i=0;i<12;i++)for(let j=i+1;j<12;j++){const d=Math.hypot(V[i][0]-V[j][0],V[i][1]-V[j][1],V[i][2]-V[j][2]);if(Math.abs(d-2)<1e-6)E.push([i,j])}
let a=0;
function draw(){
  const w=cv.width,h=cv.height,s=Math.min(w,h)*.26;
  cx.clearRect(0,0,w,h);
  a+=.0035;
  const ca=Math.cos(a),sa=Math.sin(a),cb=Math.cos(a*.7),sb=Math.sin(a*.7);
  const P=V.map(([x,y,z])=>{let X=x*ca+z*sa,Z=-x*sa+z*ca;let Y=y*cb-Z*sb;Z=y*sb+Z*cb;const k=3.5/(3.5+Z*.4);return[w/2+X*s*k,h/2+Y*s*k,Z]});
  cx.lineWidth=2*devicePixelRatio;cx.lineCap="round";
  for(const [i,j] of E){const z=(P[i][2]+P[j][2])/2;cx.strokeStyle=`rgba(98,216,96,${.16+.12*(z+2)/4})`;cx.beginPath();cx.moveTo(P[i][0],P[i][1]);cx.lineTo(P[j][0],P[j][1]);cx.stroke()}
  for(const p of P){cx.fillStyle="rgba(183,217,154,.35)";cx.beginPath();cx.arc(p[0],p[1],3*devicePixelRatio,0,7);cx.fill()}
  requestAnimationFrame(draw);
}
draw();

// Title drifts and bounces slowly (also prevents screen burn-in)
const n=document.getElementById("name");
let x=innerWidth*.2,y=innerHeight*.25,vx=.55,vy=.38;
function move(){
  const r=n.getBoundingClientRect();
  x+=vx;y+=vy;
  if(x<=0){x=0;vx=Math.abs(vx)}
  if(y<=0){y=0;vy=Math.abs(vy)}
  if(x+r.width>=innerWidth){x=innerWidth-r.width;vx=-Math.abs(vx)}
  if(y+r.height>=innerHeight){y=innerHeight-r.height;vy=-Math.abs(vy)}
  n.style.transform=`translate(${x}px,${y}px)`;
  requestAnimationFrame(move);
}
move();

// Full screen on click / F; hide the hint after a few seconds
function fs(){const e=document.documentElement;(e.requestFullscreen||e.webkitRequestFullscreen||function(){}).call(e)}
addEventListener("click",fs);
addEventListener("keydown",e=>{if(e.key==="f"||e.key==="F")fs()});
setTimeout(()=>document.getElementById("hint").style.opacity=0,6000);
</script>
</body>
</html>
