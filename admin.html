<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>Comments</title>
<style>
:root{--bg:#003320;--ink:#e9fff2;--c:#0bda51}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding:24px 16px}
main{max-width:720px;margin:0 auto}h1{color:var(--c);margin:0 0 4px}h2{color:var(--c);margin:28px 0 10px;font-size:1.1rem}
.sub{opacity:.7;margin:0 0 18px}
input{font:inherit;padding:10px 12px;border:0;border-radius:12px;background:#0f4a33;color:var(--ink);width:min(320px,100%)}
button{font:inherit;font-weight:600;padding:9px 16px;border:0;border-radius:999px;cursor:pointer;background:var(--c);color:#003320}
button.no{background:#0f4a33;color:var(--ink)}button:disabled{opacity:.5}
.card{padding:14px 16px;border-radius:14px;background:#0f4a33;margin-bottom:12px}
.card p{margin:0 0 8px;white-space:pre-wrap;word-break:break-word}.meta{font-size:.85rem;opacity:.7;margin-bottom:10px}
.row{display:flex;gap:10px;flex-wrap:wrap}.msg{margin-top:10px;color:#ffd24a}.empty{opacity:.7}
</style></head><body><main>
<h1>Comments</h1><p class="sub">Approve or delete what people post on Writer's Board.</p>
<div id="login"><input id="pw" type="password" placeholder="Password" autocomplete="current-password"> <button id="go">Open</button><p class="msg" id="lm"></p></div>
<div id="app" hidden>
<h2>Waiting for approval</h2><div id="pend"></div>
<h2>Already showing</h2><div id="appr"></div>
<p><button class="no" id="out">Lock</button></p></div>
<script>
const $=id=>document.getElementById(id);
const esc=t=>String(t).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
let pw=sessionStorage.getItem("adm")||"";
async function api(method,body,qs=""){
  const r=await fetch("/api/comments"+qs,{method,headers:{"Content-Type":"application/json","x-admin":pw},body:body?JSON.stringify(body):undefined});
  const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||"Something went wrong.");return d}
function card(c,approved){
  const d=new Date(c.date).toLocaleString([],{dateStyle:"medium",timeStyle:"short"});
  return `<div class="card"><div class="meta">${esc(c.post)} &middot; ${d}</div><p>${esc(c.text)}</p><div class="row">${approved?"":`<button data-ok="${c.id}">Approve</button>`}<button class="no" data-del="${c.id}">Delete</button></div></div>`}
async function load(){
  try{const d=await api("GET",null,"?admin=1");sessionStorage.setItem("adm",pw);
    $("login").hidden=true;$("app").hidden=false;
    $("pend").innerHTML=d.pending.length?d.pending.map(c=>card(c,false)).join(""):'<p class="empty">Nothing waiting.</p>';
    $("appr").innerHTML=d.approved.length?d.approved.map(c=>card(c,true)).join(""):'<p class="empty">None yet.</p>';
  }catch(e){$("app").hidden=true;$("login").hidden=false;$("lm").textContent=e.message;sessionStorage.removeItem("adm")}}
$("go").onclick=()=>{pw=$("pw").value;load()};$("pw").onkeydown=e=>{if(e.key==="Enter")$("go").click()};
$("out").onclick=()=>{sessionStorage.removeItem("adm");pw="";location.reload()};
document.addEventListener("click",async e=>{const b=e.target.closest("button");if(!b)return;
  const ok=b.dataset.ok,del=b.dataset.del;if(!ok&&!del)return;b.disabled=true;
  try{await api(ok?"PUT":"DELETE",{id:ok||del});await load()}catch(err){alert(err.message);b.disabled=false}});
if(pw)load();
</script></main></body></html>
