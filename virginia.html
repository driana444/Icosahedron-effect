">Rockingham</text><text x="816.7" y="324.1">Williamsburg</text><text x="258.5" y="390.0">Smyth</text><text x="836.1" y="271.0">Middlesex</text><text x="771.1" y="100.0">Alexandria</text><text x="683.7" y="396.2">Brunswick</text><text x="747.0" y="94.4">Fairfax</text><text x="725.1" y="108.3">Manassas</text><text x="664.7" y="344.0">Nottoway</text><text x="728.0" y="113.2">Prince William</text><text x="196.2" y="375.5">Russell</text><text x="605.3" y="282.5">Buckingham</text><text x="536.0" y="192.5">Augusta</text><text x="635.8" y="156.0">Madison</text><text x="748.6" y="96.6">Fairfax</text><text x="805.8" y="200.9">Westmoreland</text><text x="842.9" y="259.0">Lancaster</text><text x="790.1" y="226.8">Essex</text><text x="491.8" y="319.2">Bedford</text><text x="430.6" y="325.6">Roanoke</text><text x="725.3" y="174.6">Fredericksburg</text><text x="891.4" y="402.4">Virginia Beach</text><text x="562.6" y="248.7">Nelson</text><text x="438.2" y="250.7">Covington</text><text x="66.3" y="402.1">Lee</text></g><g id="cities"></g><g id="pins"></g></g></svg><div id="zb"><button id="zi" aria-label="Zoom in">+</button><button id="zo" aria-label="Zoom out">−</button><button id="zr" aria-label="Reset">⌂</button></div><div id="tip"></div><div id="ctl"><div id="cent"></div><div id="leg"></div></div></div></div>
<script>
const K=0.788011,S=145.8642,LON0=-83.8,LAT1=39.5;
const P=(la,lo)=>[(lo-LON0)*K*S,(LAT1-la)*S];
const COL={Path:'#d9a441',Road:'#62d860',Law:'#6fc3ff',Bridge:'#ff8f6b',Interstate:'#e86bd8'};
const RC={'Interstate':'#e86bd8','US route':'#6fc3ff','State route':'#ffd166'};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const CITIES=[['Richmond',37.5407,-77.436],['Norfolk',36.8508,-76.2859],['Roanoke',37.271,-79.9414],['Alexandria',38.8048,-77.0469],['Winchester',39.1857,-78.1633],['Charlottesville',38.0293,-78.4767],['Williamsburg',37.2707,-76.7075],['Bristol',36.5951,-82.1887]];
const cg=document.getElementById('cities');
cg.innerHTML=CITIES.map(([n,a,o])=>{const[x,y]=P(a,o);return `<g class="city"><circle cx="${x}" cy="${y}" r="4" data-r="4"/><text x="${x+8}" y="${y+5}" data-s="15">${n}</text></g>`}).join('');
let E=[],cent=1900,sel=-1;
const CENTS=[1500,1600,1700,1800,1900,2000];
fetch('va-roads.json').then(r=>r.json()).then(d=>{E=d;E.forEach((e,i)=>e.i=i);build();setCent(cent)});
function build(){
 document.getElementById('cent').innerHTML=CENTS.map(c=>`<button data-c="${c}">${c}s<small>${E.filter(e=>Math.floor(e.y/100)*100===c).length} ${E.filter(e=>Math.floor(e.y/100)*100===c).length===1?'entry':'entries'}</small></button>`).join('');
 document.querySelectorAll('#cent button').forEach(b=>b.onclick=()=>setCent(+b.dataset.c));
 document.getElementById('leg').innerHTML=Object.entries(RC).map(([k,v])=>`<span><i style="background:${v};border-radius:2px"></i>${k}</span>`).join('')+'<span style="opacity:.6">Dots: history entries</span>';
 document.getElementById('evp').innerHTML='<h2 id="evt"></h2><div id="list"></div><p class="note">Entries are Dri’s research notes; the sources listed support them. Pins mark a place named in the entry. Counties and independent cities: U.S. Census Bureau via us-atlas. Highways: Natural Earth (public domain) major-roads layer, so only main highways are shown, not local roads. Highway lines show today’s roads, not their historical routes.</p>';
 document.getElementById('list').innerHTML=E.map(e=>`<div class="it" id="it${e.i}" data-i="${e.i}"><b><span class="d" style="background:${COL[e.tag]}"></span>${esc(e.t)}</b><small>${esc(e.d)}${e.p?' · '+esc(e.p):''}</small><div class="bd"><p>${esc(e.x)}</p>${e.who?`<div class="cit">${esc(e.who)}</div>`:''}${e.pin?`<div class="cit">Map note: ${esc(e.pin)}</div>`:''}${e.s.map(q=>`<div class="cit">${esc(q.c)} <a href="${q.u}" target="_blank" rel="noopener">link</a></div>`).join('')}</div></div>`).join('');
 document.querySelectorAll('.it').forEach(el=>el.onclick=()=>select(+el.dataset.i,true));
}
const inCent=(e,c)=>Math.floor(e.y/100)*100===c;
function setCent(c){
 cent=c;sel=-1;
 document.querySelectorAll('#cent button').forEach(b=>b.classList.toggle('on',+b.dataset.c===c));
 const cur=E.filter(e=>inCent(e,c));
 document.getElementById('evt').textContent=c+'s · '+cur.length+(cur.length===1?' entry':' entries');
 E.forEach(e=>{const el=document.getElementById('it'+e.i);el.style.display=inCent(e,c)?'':'none';el.classList.remove('on')});
 draw();
}
function draw(){
 const cur=E.filter(e=>inCent(e,cent));
 document.getElementById('pins').innerHTML=cur.map(e=>{const[x,y]=P(e.ll[0],e.ll[1]);return `<g class="pin${e.i===sel?' sel':''}" data-i="${e.i}"><circle class="h" cx="${x}" cy="${y}" r="22" data-r="22"/><circle class="c" cx="${x}" cy="${y}" r="8" data-r="${e.i===sel?11:8}" fill="${COL[e.tag]}" stroke="#02150b" stroke-width="2"/></g>`}).join('');
 const tip=document.getElementById('tip'),mw=document.getElementById('mapw');
 document.querySelectorAll('.pin').forEach(g=>{const e=E[+g.dataset.i];g.onclick=()=>select(e.i,false);g.onmousemove=ev=>{const r=mw.getBoundingClientRect();tip.style.display='block';tip.textContent=e.d+' · '+e.t;tip.style.left=Math.min(ev.clientX-r.left+12,r.width-tip.offsetWidth-6)+'px';tip.style.top=(ev.clientY-r.top+12)+'px'};g.onmouseleave=()=>tip.style.display='none'});
 rescale();
}
function select(i,fromList){
 sel=(sel===i&&!fromList)?-1:i;
 document.querySelectorAll('.it').forEach(el=>el.classList.toggle('on',+el.dataset.i===sel));
 draw();
 if(sel>=0){const[x,y]=P(E[sel].ll[0],E[sel].ll[1]);zoomTo(x,y,Math.max(z,4))}
 if(sel>=0&&!fromList){const el=document.getElementById('it'+sel);el.scrollIntoView({block:'nearest',behavior:'smooth'})}
}

const W0=1000,H0=445;let z=1,cx=W0/2,cy=H0/2;
const svg=document.getElementById('map');
function vb(){const w=W0/z,h=H0/z;cx=Math.min(Math.max(cx,w/2-60),W0-w/2+60);cy=Math.min(Math.max(cy,h/2-60),H0-h/2+60);svg.setAttribute('viewBox',`${cx-w/2} ${cy-h/2} ${w} ${h}`);rescale()}
function rescale(){
 svg.querySelectorAll('[data-r]').forEach(c=>c.setAttribute('r',c.dataset.r/z));
 svg.querySelectorAll('[data-s]').forEach(t=>t.setAttribute('font-size',t.dataset.s/z));
 svg.querySelectorAll('.cn text').forEach(t=>{t.style.display=z>=3?'block':'none';t.setAttribute('font-size',11/z*1.1)});
}
function zoomTo(x,y,nz){z=Math.min(Math.max(nz,1),14);cx=x;cy=y;vb()}
function zoomAt(f,px,py){const r=svg.getBoundingClientRect();const w=W0/z,h=H0/z;const s=Math.min(r.width/w,r.height/h);const ox=(r.width-w*s)/2,oy=(r.height-h*s)/2;const mx=cx-w/2+(px-r.left-ox)/s,my=cy-h/2+(py-r.top-oy)/s;const nz=Math.min(Math.max(z*f,1),14);const nw=W0/nz,nh=H0/nz;const ns=Math.min(r.width/nw,r.height/nh);const nox=(r.width-nw*ns)/2,noy=(r.height-nh*ns)/2;cx=mx-(px-r.left-nox)/ns+nw/2;cy=my-(py-r.top-noy)/ns+nh/2;z=nz;vb()}
svg.addEventListener('wheel',e=>{e.preventDefault();zoomAt(e.deltaY<0?1.25:0.8,e.clientX,e.clientY)},{passive:false});
document.getElementById('zi').onclick=()=>{const r=svg.getBoundingClientRect();zoomAt(1.6,r.left+r.width/2,r.top+r.height/2)};
document.getElementById('zo').onclick=()=>{const r=svg.getBoundingClientRect();zoomAt(1/1.6,r.left+r.width/2,r.top+r.height/2)};
document.getElementById('zr').onclick=()=>{z=1;cx=W0/2;cy=H0/2;vb()};
const ptr=new Map();let lastD=0,moved=0;
svg.addEventListener('pointerdown',e=>{ptr.set(e.pointerId,[e.clientX,e.clientY]);moved=0;lastD=0});
svg.addEventListener('pointermove',e=>{if(!ptr.has(e.pointerId))return;const o=ptr.get(e.pointerId);const n=[e.clientX,e.clientY];
 if(ptr.size===1){const r=svg.getBoundingClientRect();const s=Math.min(r.width/(W0/z),r.height/(H0/z));const dx=n[0]-o[0],dy=n[1]-o[1];moved+=Math.abs(dx)+Math.abs(dy);if(moved>4){svg.classList.add('dr');cx-=dx/s;cy-=dy/s;ptr.set(e.pointerId,n);vb()}}
 else{ptr.set(e.pointerId,n);const [a,b]=[...ptr.values()];const d=Math.hypot(a[0]-b[0],a[1]-b[1]);if(lastD)zoomAt(d/lastD,(a[0]+b[0])/2,(a[1]+b[1])/2);lastD=d}});
const up=e=>{ptr.delete(e.pointerId);lastD=0;svg.classList.remove('dr')};
svg.addEventListener('pointerup',up);svg.addEventListener('pointercancel',up);
svg.addEventListener('click',e=>{if(moved>4){e.stopPropagation();e.preventDefault()}},true);
const tip2=document.getElementById('tip'),mw2=document.getElementById('mapw');
svg.addEventListener('mousemove',e=>{const t=e.target.closest('[data-n]');if(!t||e.target.closest('.pin')){if(!e.target.closest('.pin'))tip2.style.display='none';return}const r=mw2.getBoundingClientRect();tip2.style.display='block';tip2.textContent=t.dataset.n;tip2.style.left=Math.min(e.clientX-r.left+12,r.width-tip2.offsetWidth-6)+'px';tip2.style.top=(e.clientY-r.top+12)+'px'});
svg.addEventListener('mouseleave',()=>tip2.style.display='none');
rescale();
