<style>
:root{--forest:#1f6b3f;--bg:#013220;--cell:#02291b;--ink:#cde6d5;--green:#8fd3a8;--line:#10241a;--art:#f0fff0;--c:#0bda51;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

*,*::before,*::after{box-sizing:inherit}

header{max-width:1100px;margin:auto;padding:24px 16px 8px;text-align:center}

main{max-width:1100px;margin:auto;padding:8px 16px 60px}
h2.c{text-align:center;font-size:2rem;margin:36px 0 10px;color:var(--green)}
.tl{display:grid;grid-template-columns:repeat(10,1fr);gap:4px;background:var(--forest);padding:3px;border-radius:2px}
.yb{position:relative;aspect-ratio:28/15;border:0;padding:2px 3px;cursor:pointer;color:var(--ink);font:inherit;font-size:clamp(.62rem,2vw,.95rem);text-align:left;overflow:hidden;
 background-color:var(--cell);background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:100% calc(100%/15),calc(100%/28) 100%}
.yb:hover{outline:3px solid var(--art);z-index:1;--line:#245c3a}
.yb b{background:none;color:var(--green);padding:0 3px;font-weight:700}
.yb.ev{background-image:none;background-color:var(--forest);color:#eaf7ee}
.yb.ev b{background:none;color:#eaf7ee}
.yb small{display:block;line-height:1.05;font-size:.8em}
.yb.art::after{content:"";position:absolute;right:3px;bottom:3px;width:9px;height:9px;border-radius:50%;background:var(--art)}
.months{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}
.m{border:3px solid var(--green);padding:8px;background:none;color:inherit;font:inherit;cursor:pointer;text-align:left}
.m:hover{background:var(--cell)}

.big .dgrid{gap:4px}
.d{aspect-ratio:1;border:0;border-radius:4px;font:inherit;cursor:pointer;background:var(--cell);color:var(--ink);outline:1px solid var(--line);display:flex;align-items:flex-start;padding:4px}
.d:hover{outline:3px solid var(--green)}
.d.art{background:var(--art);color:#0e2a19}
.big .hd{font-size:.85rem;opacity:.7;text-align:center}
:focus-visible{outline:3px solid var(--art)!important;outline-offset:2px}
dialog{border:0;border-radius:12px;background:var(--bg);color:var(--ink);width:min(520px,92vw);padding:22px}
dialog::backdrop{background:rgba(0,0,0,.55)}

.slot{aspect-ratio:4/3;border:2px dashed var(--green);border-radius:8px;display:grid;place-items:center;text-align:center;margin:14px 0;overflow:hidden}
.slot img{width:100%;height:100%;object-fit:contain}
.row{display:flex;gap:10px;justify-content:space-between;align-items:center}
.btn{font:inherit;border:2px solid var(--green);background:var(--forest);color:#eaf7ee;padding:8px 14px;border-radius:8px;cursor:pointer}
.btn.o{background:none;color:var(--ink)}
.jump{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;padding:0;margin-top:24px}
.jump button,.pn button{flex:none;font:inherit;border:2px solid var(--green);background:none;color:var(--ink);padding:4px 10px;border-radius:999px;cursor:pointer;min-height:40px}
.jump button[aria-pressed="true"]{background:var(--forest);color:#eaf7ee}
.find{display:flex;gap:8px;align-items:center;justify-content:center;margin:10px 0}
.find input{font:inherit;width:9ch;padding:8px;border:2px solid var(--green);background:var(--cell);color:var(--ink);border-radius:8px}
.pn{display:flex;justify-content:space-between;gap:8px;margin:12px 0}
.feat{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.feat button{border:0;padding:0;background:var(--cell);color:var(--ink);font:inherit;cursor:pointer;text-align:left}
.feat img{width:100%;aspect-ratio:1;object-fit:cover;display:block}
.feat span{display:block;padding:6px 8px;font-size:.85rem}
.top{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:6;min-height:44px}
.top[hidden]{display:none}
#pd,#nd{font-size:.85rem;margin-bottom:4px}
h1,h2,h3,.yb,.m,.d,.jump button,#crumbs button,.pn button,.find label,.find input{font-family:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
.shell{display:grid;grid-template-columns:210px 1fr;min-height:100vh}
.content{min-width:0}
#side{position:sticky;top:0;align-self:start;height:100vh;padding:20px 12px;display:flex;flex-direction:column;gap:6px;border-right:3px solid var(--forest)}
#side button{font:inherit;font-family:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;text-align:left;border:2px solid transparent;background:none;color:var(--ink);padding:10px 12px;border-radius:8px;cursor:pointer;min-height:44px}

#side button[aria-current="page"]{background:var(--forest);color:#eaf7ee}
.home{display:grid;grid-template-columns:repeat(4,minmax(0,200px));justify-content:center;gap:14px;margin-top:10px}

.artsq video{width:100%;height:100%;object-fit:cover;display:block;mix-blend-mode:screen}
.vcovers{grid-template-columns:repeat(auto-fill,minmax(150px,200px));justify-content:center}
.mdl.vid{grid-template-columns:minmax(0,1fr) 150px;max-width:640px;margin:0 auto}
.vstage{border-radius:16px;overflow:hidden;background:#000;height:auto!important;min-height:0!important;aspect-ratio:auto!important}
.vstage video{width:100%;display:block;aspect-ratio:16/9}
.gal figure video{width:100%;height:auto;aspect-ratio:16/9;background:#000}
.box.tlb{background-color:var(--forest);background-image:none}
.box.tlb b,.box.tlb small{background:none;color:#eaf7ee}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.gal figure{margin:0;background:var(--cell);border:2px solid var(--forest)}
.gal img{width:100%;aspect-ratio:1;object-fit:cover;display:block;cursor:zoom-in}
.gal figcaption{padding:10px 12px 12px;font-size:1.05rem}.gal figcaption .ds{margin:10px 0 0;font-size:.95rem;line-height:1.5;opacity:.92}.gal figcaption .dt2{display:block;margin-top:2px;font-size:.85rem;opacity:.75}.gal audio{padding:10px 10px 0;box-sizing:border-box}
.gal audio,.gal video,.gal iframe{width:100%;display:block;border:0}
.gal video,.gal iframe{aspect-ratio:16/9}
.empty{border:2px dashed var(--forest);padding:40px 16px;text-align:center}
.cpick{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px;max-width:760px;margin:0 auto}
.cpick button{font:inherit;font-family:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:1.5rem;font-weight:800;letter-spacing:-.01em;padding:26px 10px;border:0;border-radius:16px;cursor:pointer;background:color-mix(in srgb,var(--c) 16%,var(--bg));color:var(--c)}
.cpick button:hover{filter:brightness(1.3)}
.tl.evgrid{grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px}
.tl.evgrid .yb{aspect-ratio:auto;min-height:56px;padding:8px 6px;background:transparent;border-radius:12px;box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--c) 38%,transparent);color:var(--ink);font-size:.8rem}
.tl.evgrid .yb b{color:var(--c);font-size:1.1rem;font-weight:800}

.full{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:24px}
.full h3{margin:0 0 4px;text-align:center;color:var(--green)}
.mini{display:grid;grid-template-columns:repeat(10,1fr);gap:3px;background:none;padding:0}
.mb{aspect-ratio:1;border:1px solid #1d5236;padding:0;background:var(--cell);color:var(--green);font-family:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:.9rem;font-weight:500;cursor:pointer;display:grid;place-items:center}
.mb.ev{background:var(--forest);color:#eaf7ee}
.mb.art{box-shadow:inset 0 0 0 2px var(--art)}
.mb:hover{outline:2px solid var(--art);z-index:1}

.menu{position:fixed;left:12px;top:calc(12px + env(safe-area-inset-top,0px));z-index:30;font:inherit;font-family:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;min-height:44px;padding:8px 14px;border:0;border-radius:12px;background:#0bda51;color:#013220;cursor:pointer}
#side{padding-top:70px;overflow-y:auto}
body.side-closed .shell{grid-template-columns:1fr}
body.side-closed #side{display:none}
.cent{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;margin:2px 0 10px 8px}
#side .cent button{min-height:40px;padding:6px 8px;font-size:.9rem;text-align:center;border-radius:10px;background:color-mix(in srgb,var(--c) 15%,var(--bg));color:var(--c)}
#side .cent button.wide{grid-column:span 2}
#side .cent button[aria-pressed="true"]{background:var(--c);color:#013220}

h1{font-weight:800;letter-spacing:-.025em}
h2,h3,.box b{font-weight:700;letter-spacing:-.01em}

.yb b{font-weight:700}
.cover{display:block;position:relative;width:min(520px,100%);aspect-ratio:1;margin:8px auto 0;padding:0;border:0;border-radius:20px;overflow:hidden;cursor:pointer;background:color-mix(in srgb,var(--c) 12%,var(--bg))}

.covers{display:grid;gap:16px}

.stage.art{cursor:default;touch-action:auto;display:flex;align-items:center;justify-content:center}.stage.art img{max-width:100%;max-height:100%;object-fit:contain;display:block}

.dcover img{padding:6% 8% 34%!important}.dcover .cap b{font-size:1.02rem;line-height:1.25}
.mcover img{object-fit:contain;padding:5% 8% 36%;box-sizing:border-box}.mcover .cap b{font-size:1.02rem;line-height:1.25}
.album{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.thumb{aspect-ratio:1;padding:0;border:0;border-radius:14px;overflow:hidden;cursor:pointer;background:color-mix(in srgb,var(--c) 12%,var(--bg))}

#lb #lbp,#lb #lbn{min-width:48px;font-size:1.3rem}
#foot{max-width:1100px;margin:0 auto;padding:30px 16px 40px;text-align:center;font-size:.85rem;opacity:.75}

const hE=t=>String(t).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));

function onClick(e){
  const t=e.target.closest("[data-page],[data-set],[data-back],[data-zoom],[data-ref],[data-jump],[data-full],[data-fullc],[data-fullback],[data-today],[data-art],[data-nav]");if(!t)return;

he can’t live in many places and she can’t have her child live with her.\n\nMy thing is, in hindsight and from the outside looking in, it’s like a deeper situation that she continues to put herself in. On the other side of it, you can see how maybe a few months ago she did understand that having a baby would subsequently mean she wouldn’t be able to be with her child, because she would then be labeled a sex offender due to a statute change. I guess that’s one of the things that could be that drastic: a change in a statute, in terms of a law.\n\nOne of the things I focused on was how she kept saying that she had gotten in trouble and that she was afraid she would get in trouble. I realized that over time, when I hear documentaries, individuals in these situations talk about how they don’t want to get in trouble, or the reason they didn’t say anything is because they didn’t want to get in trouble, or the reason they’re coming out now is because they don’t want to get in trouble. A lot of what they’re speaking about is either something that will make them lose their job or something that is causing them to break the law, or they are breaking the law. It’s just how that mindset translates over time. The person develops into a belief system that has worked and succeeded, up until the point it doesn’t, or up until the point it causes a drastic shift or change within their life. It changes the trajectory of it, and it can be from the smallest thing to the biggest thing.\n\nWhen you look at it from that perspective, one of the things she said was, “You’ve got to follow the rules,” and that is just so true. You just must follow them. You’ve got to do what you’ve got to do to sustain. And if it’s a situation where, one, I don’t feel like I can do what is needed in this situation, and two, I’m questioning my morals and what I’m doing, she said, “You just have to quit. I must take responsibility and step away from it.” I get that that’s the mature thing, but at the same time, now she’s in a situation where she has a two-month-old baby, she has no running water, and she can’t take care of them. I’m not even sure how she’s going to get the child an education, because you’ve got to show up.\n\nJust my perspective. At that moment.\n\n“Copyediting assistance provided by Claude (Anthropic), October 2026.”"},{title:"Working woman’s blues",nocomments:true,preview:"A poem",body:"My back is aching\nAnd my left foot too\nFor the last 15 minutes it’s felt like I had a rock in my shoe\nI’m a working woman\nYes I am\nI’m working woman\nWith hard working man\nDaddy, work me if you can"},{title:"Insert rain sounds",nocomments:true,preview:"A poem",body:"This ringing in my ear.\nquiet is loud.\nloud is quiet.\ndoors slam shut.\nringing grows louder.\nhunger deepens.\nanxiety grows.\nrest is needed.\n“Love who you are”\nThe ringing goes quiet.\nsounds become bearable.\n“The noise. What noise!”\nsickness is healing.\nI hear, winds?\nI hear a ring!\nI see everything.\nround me. In front.\nI won’t. look. behind.\nIt’s quiet.\nThe ringing is back.\nI must rest. I want to rest.\n~~Help me rest.~~"}]},

  main.querySelectorAll(".yb").forEach(b=>b.onclick=()=>go(+b.dataset.y,null));
}
$("foot").innerHTML="\u00a9 "+new Date().getFullYear()+" The Icosahedron Effect. All rights reserved. Please don't copy or reuse the art without permission.<br>Website built with AI assistance. All artwork is my own.";
const reduce=matchMedia("(prefers-reduced-motion:reduce)").matches;
function step(dir){
  if(page!=="timeline")return;
  if(st.y==null){if(full)return;const c=curC+dir*100;if(c>=100&&c<=2000){curC=c;render()}}
  else if(st.m==null){const y=st.y+dir;if(y>=100&&y<=NOW)go(y,null)}
  else{let y=st.y,m=st.m+dir;if(m<0){m=11;y--}if(m>11){m=0;y++}if(y>=100&&y<=NOW)go(y,m)}
}
function stepDay(dir){
  const d=new Date(2000,cur.m,cur.d);d.setFullYear(cur.y);d.setDate(d.getDate()+dir);
  const y=d.getFullYear(),m=d.getMonth();if(y<100||y>NOW)return;
  if(st.m!=null&&(st.y!==y||st.m!==m)){st={y,m};curC=Math.floor(y/100)*100;render()}
  day(y,m,d.getDate());
}
$("pd").onclick=()=>stepDay(-1);$("nd").onclick=()=>stepDay(1);
document.addEventListener("keydown",e=>{
  if(e.key!=="ArrowLeft"&&e.key!=="ArrowRight")return;
  if(/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)||e.metaKey||e.ctrlKey||e.altKey)return;
  const dir=e.key==="ArrowLeft"?-1:1;
  if($("lb").open){lbStep(dir);return}
  dlg.open?stepDay(dir):step(dir);
});
function swipe(el,fn){
  let x=0,y=0,ok=false;
  el.addEventListener("touchstart",e=>{ok=!e.target.closest(".jump");x=e.touches[0].clientX;y=e.touches[0].clientY},{passive:true});
  el.addEventListener("touchend",e=>{
    if(!ok)return;const t=e.changedTouches[0],dx=t.clientX-x,dy=t.clientY-y;
    if(Math.abs(dx)>60&&Math.abs(dx)>1.5*Math.abs(dy))fn(dx>0?-1:1);
  },{passive:true});
}
swipe(main,step);swipe(dlg,stepDay);swipe($("lb"),lbStep);
const topBtn=$("top");
addEventListener("scroll",()=>{topBtn.hidden=scrollY<600},{passive:true});
topBtn.onclick=()=>scrollTo({top:0,behavior:reduce?"auto":"smooth"});
render();
</script>
