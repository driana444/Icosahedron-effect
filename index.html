{"y":1803,"date":"February 24, 1803","tag":"Event","n":"Marbury","m":1,"d":24,"title":"Marbury v. Madison","people":["John Marshall","William Marbury","James Madison"],"place":"United States","text":"Marbury applied in December 1801 for a writ of mandamus ordering Secretary of State James Madison to give him his commission. The Justices did not sit from April 1802 to February 1803, when they heard argument. Marshall wrote that Marbury was entitled to his commission but that the law he relied on was unconstitutional, which showed the Court\u2019s authority to review acts of Congress.","s":[["Supreme Court Historical Society. (n.d.). The Marshall Court, 1801\u20131835. Supreme Court Historical Society.","https://supremecourthistory.org/history-of-the-courts/the-marshall-court-1801-1835/"],["Supreme Court Historical Society. (2002). Journal of Supreme Court History, 27(3). Supreme Court Historical Society.","https://supremecourthistory.org/wp-content/uploads/2025/02/Volume-27-Number-3-2002.pdf"],["Supreme Court Historical Society. (n.d.). Affirming judicial independence, 1801\u20131835 [Context essay]. Civics.supremecourthistory.org.","https://civics.supremecourthistory.org/wp-content/uploads/2023/11/Affirming-Judicial-Independence-Context-Essay.pdf"]]},

{"y":1819,"date":"1819","tag":"Event","n":"McCulloch","title":"McCulloch v. Maryland","people":["John Marshall"],"place":"United States","text":"Argument began February 22, 1819. The Court held that Congress had the power to create the Second Bank under the Constitution and that states could not tax it.","s":[["Supreme Court Historical Society. (n.d.). The Marshall Court, 1801\u20131835. Supreme Court Historical Society.","https://supremecourthistory.org/history-of-the-courts/the-marshall-court-1801-1835/"],["Supreme Court Historical Society. (n.d.). Affirming judicial independence, 1801\u20131835 [Context essay]. Civics.supremecourthistory.org.","https://civics.supremecourthistory.org/wp-content/uploads/2023/11/Affirming-Judicial-Independence-Context-Essay.pdf"]]},
{"y":1824,"date":"1824","tag":"Event","n":"Gibbons","title":"Gibbons v. Ogden","people":["John Marshall"],"place":"United States","text":"Gibbons v. Ogden was decided in 1824, after argument on February 4, 1824.","s":[["Supreme Court Historical Society. (n.d.). The Marshall Court, 1801\u20131835. Supreme Court Historical Society.","https://supremecourthistory.org/history-of-the-courts/the-marshall-court-1801-1835/"]]},

{"y":1837,"date":"January 1837","tag":"Event","n":"Taney presides","title":"Taney presides for the first time","people":["Roger B. Taney"],"place":"United States","text":"Taney presided over the Supreme Court for the first time in January 1837.","s":[["Supreme Court Historical Society. (n.d.). The Taney Court, 1836\u20131864. Supreme Court Historical Society.","https://supremecourthistory.org/history-of-the-courts/taney-court-1836-1864/"]]},
{"y":1850,"date":"1850","tag":"Group","n":"Lehman Brothers","title":"Lehman Brothers founded","people":[],"place":"New York, New York","text":"Three brothers from Germany founded the firm; it collapsed in 2008 with $639 billion in assets against $619 billion in debts.","note":"Founded in Montgomery, Alabama, then moved to New York. Filed for bankruptcy September 15, 2008, the largest in U.S. history at that time.","s":[["Encyclopaedia Britannica. (n.d.). Bankruptcy of Lehman Brothers.","https://www.britannica.com/print/article/2208103"],["EBSCO. (n.d.). Collapse of Lehman Brothers. EBSCO Research Starters.","https://www.ebsco.com/research-starters/economics/collapse-lehman-brothers"]]},
{"y":1856,"date":"May 24\u201325, 1856","tag":"Event","n":"Pottawatomie","m":4,"d":24,"title":"Pottawatomie massacre","people":["John Brown"],"place":"Franklin County, Kansas","text":"John Brown led violent abolitionist raids in Kansas, including the Pottawatomie massacre.","s":[["Kansas Historical Society. (2011). Pottawatomie massacre. Kansapedia.","https://www.kansashistory.gov/kansapedia/pottawatomie-massacre/16699"],["Encyclopaedia Britannica. (n.d.). Pottawatomie Massacre.","https://www.britannica.com/event/Pottawatomie-Massacre"]]},
{"y":1857,"date":"1857","tag":"Event","n":"Dred Scott","title":"Dred Scott v. Sandford","people":["Roger B. Taney","Dred Scott"],"place":"United States","text":"The Court heard argument in February 1856 and again in December 1856. The Justices delivered eight separate opinions after Buchanan\u2019s March 4 inauguration. The Society\u2019s page says the Court had not held an Act of Congress void since 1803 until this case. In its Journal, the Society describes Taney as denying that African Americans, enslaved or free, could be citizens.","s":[["Supreme Court Historical Society. (n.d.). The Taney Court, 1836\u20131864. Supreme Court Historical Society.","https://supremecourthistory.org/history-of-the-courts/taney-court-1836-1864/"],["Supreme Court Historical Society. (2020). Journal of Supreme Court History, 45(3). Supreme Court Historical Society.","https://supremecourthistory.org/wp-content/uploads/2025/02/Volume-45-Number-3-2020.pdf"]]},
{"y":1859,"date":"October 16\u201318, 1859","tag":"Event","n":"Harpers Ferry","m":9,"d":16,"title":"Raid on Harpers Ferry","people":["John Brown"],"place":"Harpers Ferry, Virginia","text":"John Brown led a raid on the federal armory at Harpers Ferry, Virginia.","s":[["National Park Service. (2024). John Brown's Fort. Harpers Ferry National Historical Park.","https://home.nps.gov/places/john-brown-s-fort.htm"],["National Park Service. (2024). The war that ended slavery [Information panel].","https://home.nps.gov/places/information-panel-the-war-that-ended-slavery.htm"]]},
{"y":1861,"date":"May 28, 1861","tag":"Event","n":"Merryman","m":4,"d":28,"title":"Ex parte Merryman","people":["Roger B. Taney","John Merryman"],"place":"United States","text":"Troops arrested John Merryman after the 1861 Baltimore riots. Taney announced his ruling in the Merryman case on May 28, 1861, in a dispute over Lincoln\u2019s suspension of habeas corpus.","s":[["Supreme Court Historical Society. (n.d.). The Taney Court, 1836\u20131864. Supreme Court Historical Society.","https://supremecourthistory.org/history-of-the-courts/taney-court-1836-1864/"],["Supreme Court Historical Society. (2017). Journal of Supreme Court History, 42(2). Supreme Court Historical Society.","https://supremecourthistory.org/wp-content/uploads/2025/02/Volume-42-Number-2-2017.pdf"]]},
{"y":1864,"date":"1864\u20131873","tag":"Group","n":"Chase Court","title":"Chase Court (1864\u20131873)","people":["Salmon P. Chase"],"place":"United States","text":"The Chase Court (1864\u20131873) is one of the eras of the U.S. Supreme Court listed by the Supreme Court Historical Society, named for Chief Justice Salmon P. Chase.","s":[["Supreme Court Historical Society. (n.d.). The history of the Courts. Supreme Court Historical Society.","https://supremecourthistory.org/history-of-the-courts/"]]},
{"y":1864,"date":"October 1864","tag":"Event","n":"Taney dies","title":"Taney dies; Chase named Chief Justice","people":["Roger B. Taney","Salmon P. Chase"],"place":"United States","text":"Taney died in October 1864, aged 87. Lincoln chose Salmon P. Chase to succeed him.","s":[["Supreme Court Historical Society. (n.d.). The Taney Court, 1836\u20131864. Supreme Court Historical Society.","https://supremecourthistory.org/history-of-the-courts/taney-court-1836-1864/"],["Supreme Court Historical Society. (n.d.). The Chase Court, 1864\u20131873. Supreme Court Historical Society.","https://supremecourthistory.org/history-of-the-courts/chase-court-1864-1873/"]]},
{"y":1865,"date":"December 1865","tag":"Group","n":"Ku Klux Klan","title":"Ku Klux Klan formed","people":[],"place":"Pulaski, Tennessee","text":"Formed during Reconstruction and revived in later eras. Members carried out widespread bombings, lynchings and intimidation campaigns targeting Black Americans, civil rights workers and religious minorities.","s":[["National Park Service. (n.d.). Ku Klux Klan (KKK).","https://home.nps.gov/articles/kukluxklan.htm"],["HISTORY.com Editors. (2025, November 4). Ku Klux Klan. HISTORY.","https://history.com/topics/reconstruction/ku-klux-klan"]]},
{"y":1870,"date":"1870","tag":"Event","n":"Hepburn","title":"Hepburn v. Griswold","people":["Salmon P. Chase"],"place":"United States","text":"Hepburn v. Griswold came before the Court in 1867. In 1870, the Chief Justice struck down the Legal Tender Act of 1862 as applied to contracts made before February 25, 1862.","s":[["Supreme Court Historical Society. (n.d.). The Chase Court, 1864\u20131873. Supreme Court Historical Society.","https://supremecourthistory.org/history-of-the-courts/chase-court-1864-1873/"]]},
{"y":1871,"date":"1871","tag":"Event","n":"Legal tender reversal","title":"Court reverses course on legal tender","people":["Salmon P. Chase"],"place":"United States","text":"After hearing new cases in 1871, the two new Justices joined the three dissenters.","s":[["Supreme Court Historical Society. (n.d.). The Chase Court, 1864\u20131873. Supreme Court Historical Society.","https://supremecourthistory.org/history-of-the-courts/chase-court-1864-1873/"]]},
{"y":1873,"date":"1873","tag":"Event","n":"Slaughterhouse","title":"Slaughterhouse Cases","people":["Salmon P. Chase"],"place":"United States","text":"The Society\u2019s Journal describes the 1873 decision as effectively eviscerating the Privileges or Immunities Clause of the Fourteenth Amendment. Chase died after the spring term of 1873.","s":[["Supreme Court Historical Society. (2019). Journal of Supreme Court History, 44(3). Supreme Court Historical Society.","https://supremecourthistory.org/wp-content/uploads/2022/03/SCHS-Journal-Supreme-Court-History-2019-03b.pdf"],["Supreme Court Historical Society. (n.d.). The Chase Court, 1864\u20131873. Supreme Court Historical Society.","https://supremecourthistory.org/history-of-the-courts/chase-court-1864-1873/"]]},
{"y":1874,"date":"1874\u20131888","tag":"Group","n":"Waite Court","title":"Waite Court (1874\u20131888)","people":["Morrison R. Waite"],"place":"United States","text":"The Waite Court (1874\u20131888) is one of the eras of the U.S. Supreme Court listed by the Supreme Court Historical Society, named for Chief Justice Morrison R. Waite.","s":[["Supreme Court Historical Society. (n.d.). The history of the Courts. Supreme Court Historical Society.","https://supremecourthistory.org/history-of-the-courts/"]]},
{"y":1874,"date":"1874","tag":"Event","n":"Waite","title":"Senate confirms Morrison R. Waite","people":["Morrison R. Waite"],"place":"United States","text":"The Senate confirmed President Grant\u2019s nomination of Morrison R. Waite as Chief Justice in 1874.","s":[["Supreme Court Historical Society. (n.d.). The Waite Court, 1874\u20131888. Supreme Court Historical Society.","https://supremecourthistory.org/history-of-the-courts/waite-court-1874-1888/"]]},
{"y":1877,"date":"1877","tag":"Event","n":"Granger cases","title":"Granger cases","people":["Morrison R. Waite"],"place":"United States","text":"Waite gave the Court\u2019s decision in the Granger cases in 1877. The Society dates Munn v. Illinois to 1877.","s":[["Supreme Court Historical Society. (n.d.). The Waite Court, 1874\u20131888. Supreme Court Historical Society.","https://supremecourthistory.org/history-of-the-courts/waite-court-1874-1888/"],["Supreme Court Historical Society. (n.d.). The Fuller Court, 1888\u20131910. Supreme Court Historical Society.","https://supremecourthistory.org/history-of-the-courts/fuller-court-1888-1910/"]]},
{"y":1879,"date":"1879","tag":"Event","n":"Reynolds","title":"Reynolds v. United States","people":["Morrison R. Waite"],"place":"United States","text":"In 1879, the Court affirmed Reynolds\u2019s conviction for polygamy. Reynolds was a Church member married to two women. Waite wrote for a unanimous Court.","s":[["Supreme Court Historical Society. (2016). Journal of Supreme Court History, 41(1). Supreme Court Historical Society.","https://supremecourthistory.org/wp-content/uploads/2025/02/Volume-41-Number-1-2016.pdf"]]},
{"y":1883,"date":"1883","tag":"Event","n":"Civil Rights Cases","title":"Civil Rights Cases","people":["Morrison R. Waite"],"place":"United States","text":"In 1883, eight Justices held the Civil Rights Act of 1875 unconstitutional.","s":[["Supreme Court Historical Society. (n.d.). The Waite Court, 1874\u20131888. Supreme Court Historical Society.","https://supremecourthistory.org/history-of-the-courts/waite-court-1874-1888/"]]},
{"y":1888,"date":"1888\u20131910","tag":"Group","n":"Fuller Court","title":"Fuller Court (1888\u20131910)","people":["Melville W. Fuller"],"place":"United States","text":"The Fuller Court (1888\u20131910) is one of the eras of the U.S. Supreme Court listed by the Supreme Court Historical Society, named for Chief Justice Melville W. Fuller.","s":[["Supreme Court Historical Society. (n.d.). The history of the Courts. Supreme Court Historical Society.","https://supremecourthistory.org/history-of-the-courts/"]]},
{"y":1888,"date":"1888","tag":"Event","n":"Fuller","title":"Melville W. Fuller becomes Chief Justice","people":["Melville W. Fuller"],"place":"United States","text":"Fuller succeeded Waite as Chief Justice in 1888. Waite died that year.","s":[["Supreme Court Historical Society. (n.d.). The Fuller Court, 1888\u20131910. Supreme Court Historical Society.","https://supremecourthistory.org/history-of-the-courts/fuller-court-1888-1910/"],["Supreme Court Historical Society. (n.d.). The Waite Court, 1874\u20131888. Supreme Court Historical Society.","https://supremecourthistory.org/history-of-the-courts/waite-court-1874-1888/"]]},
{"y":1892,"date":"1892","tag":"Event","n":"Plessy challenge","title":"Plessy challenges Louisiana\u2019s railway law","people":["Homer Plessy"],"place":"United States","text":"Homer Adolph Plessy challenged the Louisiana law in 1892 and took his case to the Supreme Court.","s":[["Supreme Court Historical Society. (n.d.). The Fuller Court, 1888\u20131910. Supreme Court Historical Society.","https://supremecourthistory.org/history-of-the-courts/fuller-court-1888-1910/"]]},
{"y":1895,"date":"1895","tag":"Event","n":"Income tax","title":"Income tax held unconstitutional","people":["Melville W. Fuller"],"place":"United States","text":"The Court held a federal income tax unconstitutional in 1895. With one Justice ill, the Court first divided four to four, and a second argument ended 5\u20134 against the tax. The Sixteenth Amendment made the income tax constitutional in 1913.","s":[["Supreme Court Historical Society. (n.d.). The Fuller Court, 1888\u20131910. Supreme Court Historical Society.","https://supremecourthistory.org/history-of-the-courts/fuller-court-1888-1910/"]]},
{"y":1896,"date":"1896","tag":"Event","n":"Plessy","title":"Plessy v. Ferguson","people":["Melville W. Fuller","Homer Plessy"],"place":"United States","text":"The Court upheld racial segregation under the \u201cseparate but equal\u201d doctrine. The Society says Fuller joined a 7\u20131 majority.","s":[["Supreme Court Historical Society. (n.d.). Melville W. Fuller. Civics.supremecourthistory.org.","https://civics.supremecourthistory.org/article/melville-w-fuller/"],["Supreme Court Historical Society. (n.d.). The Fuller Court, 1888\u20131910. Supreme Court Historical Society.","https://supremecourthistory.org/history-of-the-courts/fuller-court-1888-1910/"]]},
{"y":1905,"date":"1905","tag":"Event","n":"Lochner","title":"Lochner v. New York","people":[],"place":"United States","text":"The bakery case reached the Court in 1905.","s":[["Supreme Court Historical Society. (n.d.). The Fuller Court, 1888\u20131910. Supreme Court Historical Society.","https://supremecourthistory.org/history-of-the-courts/fuller-court-1888-1910/"],["Supreme Court Historical Society. (n.d.). The Taft Court, 1921\u20131930. Supreme Court Historical Society.","https://supremecourthistory.org/history-of-the-courts/taft-court-1921-1930/"]]},
{"y":1910,"date":"1910\u20131921","tag":"Group","n":"White Court","title":"White Court (1910\u20131921)","people":["Edward Douglass White"],"place":"United States","text":"The White Court (1910\u20131921) is one of the eras of the U.S. Supreme Court listed by the Supreme Court Historical Society, named for Chief Justice Edward Douglass White.","s":[["Supreme Court Historical Society. (n.d.). The history of the Courts. Supreme Court Historical Society.","https://supremecourthistory.org/history-of-the-courts/"]]},
{"y":1910,"date":"1910","tag":"Event","n":"Standard Oil","title":"Standard Oil antitrust case","people":["Edward Douglass White"],"place":"United States","text":"The Court affirmed the order but altered the law. Chief Justice White said Congress meant to punish only \u201cunreasonable\u201d restraint of trade, creating the \u201crule of reason.\u201d","s":[["Supreme Court Historical Society. (n.d.). The White Court, 1910\u20131921. Supreme Court Historical Society.","https://supremecourthistory.org/history-of-the-courts/white-court-1910-1921/"]]},
{"y":1914,"date":"1914","tag":"Event","n":"Evidence rule","title":"Illegally seized evidence barred in federal court","people":[],"place":"United States","text":"The White Court held that federal judges must not admit evidence federal officers seize illegally. Until 1961, the Court left states free to admit it.","s":[["Supreme Court Historical Society. (n.d.). The White Court, 1910\u20131921. Supreme Court Historical Society.","https://supremecourthistory.org/history-of-the-courts/white-court-1910-1921/"]]},
{"y":1916,"date":"January 1916","tag":"Event","n":"Brandeis","title":"Wilson nominates Louis D. Brandeis","people":["Louis D. Brandeis","Woodrow Wilson"],"place":"United States","text":"In January 1916, President Woodrow Wilson nominated Louis D. Brandeis for Associate Justice.","s":[["Supreme Court Historical Society. (n.d.). The White Court, 1910\u20131921. Supreme Court Historical Society.","https://supremecourthistory.org/history-of-the-courts/white-court-1910-1921/"]]},
{"y":1919,"date":"1919","tag":"Group","n":"Galleanists","title":"Galleanist mail bombs","people":["Luigi Galleani"],"place":"U.S. cities","text":"An anarchist network responsible for a series of mail bombings and explosions across U.S. cities in 1919.","note":"Washington, D.C. (the June 2 bombs hit eight cities; this pin marks the Attorney General\u2019s home)","s":[["Federal Bureau of Investigation. (n.d.). 1919 bombings.","https://www.fbi.gov/philadelphia/about-us/history/famous-cases/famous-cases-1919-bombings"],["Wikipedia contributors. (n.d.). 1919 United States anarchist bombings. Wikipedia. Retrieved November 22, 2026.","https://en.wikipedia.org/wiki/1919_United_States_anarchist_bombings"]]},
{"y":1920,"date":"September 16, 1920","tag":"Event","n":"Wall St. bombing","m":8,"d":16,"title":"Wall Street bombing","people":["Luigi Galleani (suspected followers)"],"place":"Wall Street, New York City","text":"An explosion that killed 38 people. It has been linked to the Galleanists, but no one was ever convicted.","s":[["Federal Bureau of Investigation. (n.d.). Wall Street bombing 1920.","https://www.fbi.gov/history/famous-cases/wall-street-bombing-1920"],["Encyclopaedia Britannica. (n.d.). Wall Street bombing of 1920.","https://www.britannica.com/print/article/1972557"]]},
{"y":1921,"date":"1921\u20131930","tag":"Group","n":"Taft Court","title":"Taft Court (1921\u20131930)","people":["William Howard Taft"],"place":"United States","text":"The Taft Court (1921\u20131930) is one of the eras of the U.S. Supreme Court listed by the Supreme Court Historical Society, named for Chief Justice William Howard Taft.","s":[["Supreme Court Historical Society. (n.d.). The history of the Courts. Supreme Court Historical Society.","https://supremecourthistory.org/history-of-the-courts/"]]},
{"y":1922,"date":"October 30\u201331, 1922","tag":"Person","n":"Mussolini","title":"Mussolini becomes prime minister of Italy","people":["Benito Mussolini"],"place":"Rome, Italy","text":"After the March on Rome, King Victor Emmanuel III appointed Mussolini prime minister, beginning more than two decades of Fascist rule.","note":"Sources differ by a day: Britannica gives October 31, other sources October 30.","s":[["Encyclopaedia Britannica. (n.d.). Rise to power of Benito Mussolini.","https://www.britannica.com/biography/Benito-Mussolini/Rise-to-power"],["Encyclopaedia Britannica. (n.d.). March on Rome.","https://www.britannica.com/event/March-on-Rome"]]},
{"y":1922,"date":"1922","tag":"Event","n":"Child Labor Law","title":"Child Labor Law held invalid","people":["William Howard Taft"],"place":"United States","text":"The Court decided the law imposed a penalty, not a tax, and held it invalid. Taft wrote that the Tenth Amendment reserves problems like child labor for the states. The Court overruled its child labor decisions in 1941.","s":[["Supreme Court Historical Society. (n.d.). The Taft Court, 1921\u20131930. Supreme Court Historical Society.","https://supremecourthistory.org/history-of-the-courts/taft-court-1921-1930/"]]},
{"y":1923,"date":"1923","tag":"Event","n":"Adkins","title":"Adkins v. Children\u2019s Hospital","people":["William Howard Taft"],"place":"United States","text":"In 1923, the Court surprised many observers with its choice of precedents in deciding Adkins v. Children\u2019s Hospital.","s":[["Supreme Court Historical Society. (n.d.). The Taft Court, 1921\u20131930. Supreme Court Historical Society.","https://supremecourthistory.org/history-of-the-courts/taft-court-1921-1930/"]]},
{"y":1925,"date":"April 1925","tag":"Group","n":"SS founded","title":"SS (Schutzstaffel) founded","people":["Adolf Hitler"],"place":"Germany","text":"Hitler founded the SS as a small personal bodyguard; it grew into a massive force of about 250,000 men by 1939.","note":"Pin placed at Berlin, the SS's later headquarters. The Waffen-SS armed branch was established in late 1939.","s":[["Encyclopaedia Britannica. (n.d.). SS.","https://www.britannica.com/topic/SS"],["United States Holocaust Memorial Museum. (n.d.). SS: Key dates. Holocaust Encyclopedia.","https://encyclopedia.ushmm.org/content/en/article/ss-key-dates?series=27"],["History.com Editors. (2025, December 3). The SS. HISTORY.","https://www.history.com/articles/ss"]]},
{"y":1925,"date":"July 18, 1925","tag":"Event","n":"Mein Kampf","m":6,"d":18,"title":"Mein Kampf, Volume 1, published","people":["Adolf Hitler"],"place":"Munich, Germany","text":"Volume 1 appeared July 18, 1925, and Volume 2 on December 11, 1926, from the Franz Eher Nachf. publishing house in Munich.","s":[["Historisches Lexikon Bayerns. (n.d.). Mein Kampf (Adolf Hitler, 1925/26).","https://www.historisches-lexikon-bayerns.de/Lexikon/EN:Mein_Kampf_(Adolf_Hitler,_1925/26)"],["Encyclopaedia Britannica. (n.d.). Mein Kampf.","https://www.britannica.com/topic/Mein-Kampf"]]},
{"y":1925,"date":"1925","tag":"Event","n":"Gitlow","title":"Gitlow case decided","people":["Benjamin Gitlow"],"place":"United States","text":"Gitlow\u2019s pamphlet appeared in 1919, and New York arrested him under its criminal anarchy law. The Court was deciding his case in 1925 and upheld the conviction.","s":[["Supreme Court Historical Society. (n.d.). The Taft Court, 1921\u20131930. Supreme Court Historical Society.","https://supremecourthistory.org/history-of-the-courts/taft-court-1921-1930/"],["Supreme Court Historical Society. (n.d.). The Hughes Court, 1930\u20131941. Supreme Court Historical Society.","https://supremecourthistory.org/history-of-the-courts/hughes-court-1930-1941/"]]},
{"y":1925,"date":"1925","tag":"Event","n":"Judges\u2019 Bill","title":"\u201cJudges\u2019 Bill\u201d passed","people":["William Howard Taft"],"place":"United States","text":"The \u201cJudges\u2019 Bill\u201d passed in 1925, and the Society says the Court then gained freedom to choose its cases.","s":[["Supreme Court Historical Society. (n.d.). The Taft Court, 1921\u20131930. Supreme Court Historical Society.","https://supremecourthistory.org/history-of-the-courts/taft-court-1921-1930/"]]},
{"y":1930,"date":"1930\u20131941","tag":"Group","n":"Hughes Court","title":"Hughes Court (1930\u20131941)","people":["Charles Evans Hughes"],"place":"United States","text":"The Hughes Court (1930\u20131941) is one of the eras of the U.S. Supreme Court listed by the Supreme Court Historical Society, named for Chief Justice Charles Evans Hughes.","s":[["Supreme Court Historical Society. (n.d.). The history of the Courts. Supreme Court Historical Society.","https://supremecourthistory.org/history-of-the-courts/"]]},
{"y":1931,"date":"March 25, 1931","tag":"Event","n":"Scottsboro","m":2,"d":25,"title":"Scottsboro case begins","people":[],"place":"United States","text":"The Scottsboro case began when a freight train was stopped and nine Black youths were arrested on March 25, 1931.","s":[["Supreme Court Historical Society. (n.d.). The Hughes Court, 1930\u20131941. Supreme Court Historical Society.","https://supremecourthistory.org/history-of-the-courts/hughes-court-1930-1941/"]]},
{"y":1931,"date":"1931","tag":"Event","n":"Near","title":"Near v. Minnesota","people":["Charles Evans Hughes"],"place":"United States","text":"In 1931, the Supreme Court struck down the Minnesota public-nuisance statute that legislators passed in 1925.","s":[["Supreme Court Historical Society. (n.d.). The Hughes Court, 1930\u20131941. Supreme Court Historical Society.","https://supremecourthistory.org/history-of-the-courts/hughes-court-1930-1941/"]]},
{"y":1933,"date":"January 30, 1933","tag":"Person","n":"Hitler","m":0,"d":30,"title":"Hitler appointed chancellor of Germany","people":["Adolf Hitler"],"place":"Berlin, Germany","text":"President Paul von Hindenburg appointed Hitler chancellor through Germany's legal, constitutional process.","s":[["United States Holocaust Memorial Museum. (n.d.). Adolf Hitler appointed chancellor. Holocaust Encyclopedia.","https://encyclopedia.ushmm.org/content/en/timeline-event/hitler-appointed-chancellor"],["United States Holocaust Memorial Museum. (n.d.). The Nazi rise to power. Holocaust Encyclopedia.","https://encyclopedia.ushmm.org/content/en/article/the-nazi-rise-to-power"]]},

function onClick(e){
  const t=e.target.closest("[data-page],[data-set],[data-back],[data-zoom],[data-ref],[data-jump],[data-full],[data-fullc],[data-fullback],[data-today],[data-art],[data-nav]");if(!t)return;
  if(t.dataset.page){nav(t.dataset.page);return}
  if(t.dataset.set!==undefined){setIdx=+t.dataset.set;render();scrollTo(0,0);return}
  if("back" in t.dataset){setIdx=null;render();scrollTo(0,0);return}
  if(t.dataset.ref!==undefined){const L=lbList();const k=L.findIndex(x=>x.i===+t.dataset.ref);showLb(Math.max(k,0));if(!$("lb").open)$("lb").showModal();return}

  if(t.dataset.jump){page="timeline";curC=+t.dataset.jump;full=false;fullC=null;st={y:null,m:null};render();scrollTo(0,0)}
  else if(t.dataset.fullc){page="timeline";st={y:null,m:null};fullC=+t.dataset.fullc;zoomFrom=t.getBoundingClientRect();render();scrollTo(0,0)}
  else if("fullback" in t.dataset){fullC=null;render();scrollTo(0,0)}
  else if("full" in t.dataset){const was=page==="timeline"&&full;page="timeline";full=!was;fullC=null;st={y:null,m:null};render();scrollTo(0,0)}
  else if("today" in t.dataset){page="timeline";const n=new Date();go(Math.min(n.getFullYear(),NOW),n.getMonth())}

}

begin \u2022 International Military Tribunal \u2022 Nuremberg, Germany \u2022 November 20, 1945\n\u2022 George Lincoln Rockwell founds the American Nazi Party \u2022 George Lincoln Rockwell \u2022 Arlington, Virginia \u2022 1959\n\u2022 The Order (Br\u00fcder Schweigen) \u2022 Alan Berg \u2022 Pacific Northwest \u2022 1983\u20131984\n\u2022 The Covenant, the Sword, and the Arm of the Lord (CSA) \u2022 Arkansas \u2022 1980s\n\nPOLITICAL VIOLENCE AND ATTACKS\n\u2022 Pottawatomie massacre \u2022 John Brown \u2022 Franklin County, Kansas \u2022 May 24\u201325, 1856\n\u2022 Raid on Harpers Ferry \u2022 John Brown \u2022 Harpers Ferry, Virginia \u2022 October 16\u201318, 1859\n\u2022 Galleanist mail bombs \u2022 Luigi Galleani \u2022 U.S. cities \u2022 1919\n\u2022 Wall Street bombing \u2022 Luigi Galleani (suspected followers) \u2022 Wall Street, New York City \u2022 September 16, 1920\n\u2022 Weather Underground \u2022 United States \u2022 Late 1960s\u20131970s\n\u2022 Black Liberation Army (BLA) \u2022 United States \u2022 1970s\u2013early 1980s\n\u2022 Armed Forces of National Liberation (FALN) \u2022 United States \u2022 1974\u20131983\n\u2022 Fraunces Tavern bombing \u2022 New York City \u2022 January 24, 1975\n\u2022 Ted Kaczynski (The Unabomber) \u2022 Ted Kaczynski \u2022 Nationwide \u2022 1978\u20131995\n\u2022 Oklahoma City bombing \u2022 Timothy McVeigh, Terry Nichols \u2022 Alfred P. Murrah Federal Building, Oklahoma City \u2022 April 19, 1995\n\u2022 Eric Rudolph bombings \u2022 Eric Rudolph \u2022 Atlanta, Georgia and other sites \u2022 1996\u20131998\n\u2022 Earth Liberation Front and Animal Liberation Front \u2022 Ski resorts, logging companies, research labs \u2022 Late 1990s\u2013early 2000s\n\u2022 2001 anthrax attacks \u2022 Bruce Ivins \u2022 Letters mailed to media outlets and U.S. Senators \u2022 Fall 2001\n\u2022 Sikh temple shooting \u2022 Wade Michael Page \u2022 Oak Creek, Wisconsin \u2022 August 5, 2012\n\u2022 Emanuel AME Church shooting \u2022 Dylann Roof \u2022 Charleston, South Carolina \u2022 June 17, 2015\n\u2022 Tree of Life synagogue shooting \u2022 Robert Bowers \u2022 Pittsburgh, Pennsylvania \u2022 October 27, 2018\n\u2022 El Paso Walmart shooting \u2022 Patrick Crusius \u2022 El Paso, Texas \u2022 August 3, 2019\n\u2022 Attack on the U.S. Capitol \u2022 Oath Keepers and Proud Boys leaders \u2022 Washington, D.C. \u2022 January 6, 2021\n\u2022 Buffalo supermarket shooting \u2022 Payton Gendron \u2022 Buffalo, New York \u2022 May 14, 2022\n\nBUSINESS, CHURCH AND CAMPUS CASES\n\u2022 Lehman Brothers founded \u2022 New York, New York \u2022 1850\n\u2022 Eddie Long becomes senior pastor of New Birth Missionary Baptist Church \u2022 Eddie Long \u2022 Lithonia, Georgia \u2022 1987\n\u2022 Jensen Huang co-founds NVIDIA \u2022 Jensen Huang \u2022 Santa Clara, California \u2022 April 1993\n\u2022 Penn State cocaine trafficking case \u2022 State College, Pennsylvania \u2022 2023\u20132024 (alleged)"},{title:"Cookie poem",heading:"Cookie",nocomments:true,preview:"A poem about a cookie",body:"I’m so hungry\nJust a cookie will do\nMaybe two\nThey smell so good\nOnly if i could 😞\nHave a delicious treat\nThat’ll keep me on my feet\nI love cookies you know\nIn the oven i see them grow\nCrispy brown skin\nChocolate chips within\nOne cookie indeed\nThat’s all i need\nNo good night kiss\nNo sweet eternal bliss\nJust one sweet bite\nWhen all gone goodnight 😴\nOh how lovely they look\nPicture perfect in my book 📖\nAs the smell creeps through the air\nAll tangled in my hair ☺️\nMy tummy is so glad to see\nWhat’s down there waiting for me\nThose precious little babies\nUgh i must sound so crazy 😜\nAll flawless under the light\nCan’t wait for that sweet treat tonight"},{title:"In trouble",heading:"In trouble",nocomments:true,preview:"Just my perspective",body:"I was watching a talk show, and a young lady was talking about how she started an inappropriate relationship with an inmate at the age of 21. The inmate was around 37. Throughout the conversation, I gathered that the young lady did not understand that the relationship was inappropriate and that there was a power dynamic, with her being in more control. She stated that she doesn’t understand why she must register as a sex offender with that crime on her record. She now has a two-month-old baby, and she’s in a situation where she can’t live in many places and she can’t have her child live with her.\n\nMy thing is, in hindsight and from the outside looking in, it’s like a deeper situation that she continues to put herself in. On the other side of it, you can see how maybe a few months ago she did understand that having a baby would subsequently mean she wouldn’t be able to be with her child, because she would then be labeled a sex offender due to a statute change. I guess that’s one of the things that could be that drastic: a change in a statute, in terms of a law.\n\nOne of the things I focused on was how she kept saying that she had gotten in trouble and that she was afraid she would get in trouble. I realized that over time, when I hear documentaries, individuals in these situations talk about how they don’t want to get in trouble, or the reason they didn’t say anything is because they didn’t want to get in trouble, or the reason they’re coming out now is because they don’t want to get in trouble. A lot of what they’re speaking about is either something that will make them lose their job or something that is causing them to break the law, or they are breaking the law. It’s just how that mindset translates over time. The person develops into a belief system that has worked and succeeded, up until the point it doesn’t, or up until the point it causes a drastic shift or change within their life. It changes the trajectory of it, and it can be from the smallest thing to the biggest thing.\n\nWhen you look at it from that perspective, one of the things she said was, “You’ve got to follow the rules,” and that is just so true. You just must follow them. You’ve got to do what you’ve got to do to sustain. And if it’s a situation where, one, I don’t feel like I can do what is needed in this situation, and two, I’m questioning my morals and what I’m doing, she said, “You just have to quit. I must take responsibility and step away from it.” I get that that’s the mature thing, but at the same time, now she’s in a situation where she has a two-month-old baby, she has no running water, and she can’t take care of them. I’m not even sure how she’s going to get the child an education, because you’ve got to show up.\n\nJust my perspective. At that moment.\n\n“Copyediting assistance provided by Claude (Anthropic), October 2026.”"},{title:"Working woman’s blues",nocomments:true,preview:"A poem",body:"My back is aching\nAnd my left foot too\nFor the last 15 minutes it’s felt like I had a rock in my shoe\nI’m a working woman\nYes I am\nI’m working woman\nWith hard working man\nDaddy, work me if you can"},{title:"Insert rain sounds",nocomments:true,preview:"A poem",body:"This ringing in my ear.\nquiet is loud.\nloud is quiet.\ndoors slam shut.\nringing grows louder.\nhunger deepens.\nanxiety grows.\nrest is needed.\n“Love who you are”\nThe ringing goes quiet.\nsounds become bearable.\n“The noise. What noise!”\nsickness is healing.\nI hear, winds?\nI hear a ring!\nI see everything.\nround me. In front.\nI won’t. look. behind.\nIt’s quiet.\nThe ringing is back.\nI must rest. I want to rest.\n~~Help me rest.~~"}]},

}

const bioHTML=()=>`<div class="bio"><h2 class="c">Bio</h2><p>Hi! My name is Dri. I am an artist from Richmond, Virginia. I believe life requires collective effort: a balance between all aspects of who we are and who or what we choose to be.</p><p>Through therapy and healing, I was given the opportunity to develop a way to conceptualize life. I’ve titled my work The Icosahedron Effect.</p><p>I chose this name in honor of my mother and father.</p><p>My father introduced me to dice at a very young age. A die with 20 sides, five times what I knew. I was amazed. My father was artistic at heart. He painted game pieces for Dungeons and Dragons, sharing his love of the arts with my siblings and me.</p><p>My mother was the die that held the 20 sides. She helped me connect with life. Understanding that one die can have many different sides is the formula that applies to human existence. One person is filled with many different sides. All of which you can grow to know and love for yourself.</p><p>The icosahedron shape, in its capacity, is the shape of life. Maybe. This website is my mind, research, and unfinished self on display.</p><p>I love structure and building.</p><p>Thank you for visiting!</p><p>—Dri</p></div>`;

function card(s,it,i){

}

  if(zoomFrom&&!matchMedia("(prefers-reduced-motion:reduce)").matches){
    const r=main.getBoundingClientRect(),ox=zoomFrom.left+zoomFrom.width/2-r.left,oy=zoomFrom.top+zoomFrom.height/2-r.top;
    main.animate([{transform:"scale(.2)",opacity:0,transformOrigin:ox+"px "+oy+"px"},{transform:"scale(1)",opacity:1,transformOrigin:ox+"px "+oy+"px"}],{duration:450,easing:"cubic-bezier(.2,.8,.2,1)"});
  }
  zoomFrom=null;
  main.querySelectorAll(".yb").forEach(b=>b.onclick=()=>go(+b.dataset.y,null));
}
$("foot").innerHTML="\u00a9 "+new Date().getFullYear()+" The Icosahedron Effect. All rights reserved. Please don't copy or reuse the art without permission.<br>Website built with AI assistance. All artwork is my own.";
const reduce=matchMedia("(prefers-reduced-motion:reduce)").matches;
function step(dir){
  if(page!=="timeline")return;
  if(st.y==null){if(full)return;const c=curC+dir*100;if(c>=100&&c<=2000){curC=c;render()}}
  else if(st.m==null){const y=st.y+dir;if(y>=100&&y<=NOW)go(y,null)}
  else{let y=st.y,m=st.m+dir;if(m<0){m=11;y--}if(m>11){m=0;y++}if(y>=100&&y<=NOW)go(y,m)}
}
function stepDay(dir){
  const d=new Date(2000,cur.m,cur.d);d.setFullYear(cur.y);d.setDate(d.getDate()+dir);
  const y=d.getFullYear(),m=d.getMonth();if(y<100||y>NOW)return;
  if(st.m!=null&&(st.y!==y||st.m!==m)){st={y,m};curC=Math.floor(y/100)*100;render()}
  day(y,m,d.getDate());
}
$("pd").onclick=()=>stepDay(-1);$("nd").onclick=()=>stepDay(1);
document.addEventListener("keydown",e=>{
  if(e.key!=="ArrowLeft"&&e.key!=="ArrowRight")return;
  if(/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)||e.metaKey||e.ctrlKey||e.altKey)return;
  const dir=e.key==="ArrowLeft"?-1:1;
  if($("lb").open){lbStep(dir);return}
  dlg.open?stepDay(dir):step(dir);
});
function swipe(el,fn){
  let x=0,y=0,ok=false;
  el.addEventListener("touchstart",e=>{ok=!e.target.closest(".jump");x=e.touches[0].clientX;y=e.touches[0].clientY},{passive:true});
  el.addEventListener("touchend",e=>{
    if(!ok)return;const t=e.changedTouches[0],dx=t.clientX-x,dy=t.clientY-y;
    if(Math.abs(dx)>60&&Math.abs(dx)>1.5*Math.abs(dy))fn(dx>0?-1:1);
  },{passive:true});
}
swipe(main,step);swipe(dlg,stepDay);swipe($("lb"),lbStep);
const topBtn=$("top");
addEventListener("scroll",()=>{topBtn.hidden=scrollY<600},{passive:true});
topBtn.onclick=()=>scrollTo({top:0,behavior:reduce?"auto":"smooth"});
render();
</script>
