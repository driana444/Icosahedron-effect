<style>

body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}

.tl{display:grid;grid-template-columns:repeat(10,1fr);gap:4px;background:var(--forest);padding:3px;border-radius:2px}
.yb{position:relative;aspect-ratio:28/15;border:0;padding:2px 3px;cursor:pointer;color:var(--ink);font:inherit;font-size:clamp(.62rem,2vw,.95rem);text-align:left;overflow:hidden;
 background-color:var(--cell);background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:100% calc(100%/15),calc(100%/28) 100%}

.content{min-width:0}

.empty{border:2px dashed var(--forest);padding:40px 16px;text-align:center}
.full{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:24px}

.mini{display:grid;grid-template-columns:repeat(10,1fr);gap:3px;background:none;padding:0}
.mb{aspect-ratio:1;border:1px solid #1d5236;padding:0;background:var(--cell);color:var(--green);font-family:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:.9rem;font-weight:500;cursor:pointer;display:grid;place-items:center}
.mb.ev{background:var(--forest);color:#eaf7ee}
.mb.art{box-shadow:inset 0 0 0 2px var(--art)}

.menu{position:fixed;left:12px;top:calc(12px + env(safe-area-inset-top,0px));z-index:30;font:inherit;font-family:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;min-height:44px;padding:8px 14px;border:0;border-radius:12px;background:#0bda51;color:#013220;cursor:pointer}
#side{padding-top:70px;overflow-y:auto}
body.side-closed .shell{grid-template-columns:1fr}

.cent{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;margin:2px 0 10px 8px}

h1{font-weight:800;letter-spacing:-.025em}
h2,h3,.box b{font-weight:700;letter-spacing:-.01em}
.yb b,.mb,.d,.m .dgrid div{font-variant-numeric:tabular-nums}
.yb b{font-weight:700}

.cover .cap b{display:block;font-size:1.4rem}.cover .cap small{color:var(--c);font-size:.95rem}
.cover .dt{display:block;margin-top:2px}

.covers{display:grid;gap:16px}
.covers.multi{grid-template-columns:repeat(auto-fill,minmax(240px,1fr))}
.covers.multi .cover{width:100%;margin:0}
.stage.art{cursor:default;touch-action:auto;display:flex;align-items:center;justify-content:center}.stage.art img{max-width:100%;max-height:100%;object-fit:contain;display:block}

.mdl.solo{grid-template-columns:1fr;justify-items:center;text-align:center}.mdl.solo aside{align-items:center}
.dcover img{padding:6% 8% 34%!important}.dcover .cap b{font-size:1.02rem;line-height:1.25}
.mcover img{object-fit:contain;padding:8% 8% 22%;box-sizing:border-box}
.album{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.thumb{aspect-ratio:1;padding:0;border:0;border-radius:14px;overflow:hidden;cursor:pointer;background:color-mix(in srgb,var(--c) 12%,var(--bg))}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb:hover{filter:brightness(1.15)}
#lb #lbp,#lb #lbn{min-width:48px;font-size:1.3rem}
#foot{max-width:1100px;margin:0 auto;padding:30px 16px 40px;text-align:center;font-size:.85rem;opacity:.75}

.box{border:0;border-radius:18px;background-image:none;background-color:color-mix(in srgb,var(--c) 18%,var(--bg));color:var(--c)}

<body>
<button id="menu" class="menu" aria-controls="side" aria-expanded="true">&#10005; Close</button>
<div class="shell"><nav id="side" aria-label="Sections"></nav><div class="content">
<header><h1>The Icosahedron Effect</h1><p class="by">by Dri</p><nav id="crumbs" aria-label="Breadcrumb"></nav></header>
<main id="main"></main>
<form name="comments" method="POST" data-netlify="true" netlify-honeypot="bot-field" hidden><input name="bot-field"><input name="post"><textarea name="comment"></textarea></form>
<footer id="foot"></footer>
</div></div>
<button class="btn top" id="top" aria-label="Back to top" hidden>&#x2191; Top</button>
<dialog id="dlg" aria-labelledby="dt">
  <div class="row"><h2 id="dt"></h2><button class="btn o" id="close">Close</button></div>
  <p id="evs"></p>
  <div class="slot" id="slot"></div>
  <div class="row"><button class="btn o" id="pd">&#x2039; Previous day</button><button class="btn o" id="nd">Next day &#x203A;</button></div>
  <div class="row"><span id="cap"></span></div>
</dialog>

<script>
const EVENTS=[["Trans-Atlantic Slave Trade",1526],["Independence Day",1776],["Washington",1789],["Emancipation",1865],["Roosevelt",1901],["Taft",1909],["Wilson",1913],["WW1",1914],["Harding",1921],["Coolidge",1923],["Hoover",1929],["Holocaust",1933],["FDR",1933],["WW2",1939],["Holocaust End",1944],["Truman",1945],["Korean War",1950],["Eisenhower",1953],["Colored TV",1955],["Vietnam War",1955],["Kennedy",1961],["Johnson",1963],["Nixon",1969],["Ford",1974],["Carter",1977],["Reagan",1981],["George H.W. Bush",1989],["Clinton",1993],["Bush",2001],["9/11",2001],["Obama",2009],["Trump",2017],["Biden",2021],["Trump",2025],["Present Day",2026]];

const ART={};
const NOW=2026,MN=["January","February","March","April","May","June","July","August","September","October","November","December"],WD=["S","M","T","W","T","F","S"];

const $=id=>document.getElementById(id),main=$("main"),crumbs=$("crumbs"),dlg=$("dlg");

const key=(y,m,d)=>`${y}-${String(m+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`;

function featured(){
  const k=Object.keys(ART).sort();if(!k.length)return "";
  return `<h2 class="c" style="margin-top:12px">Featured art</h2><div class="feat">${k.slice(0,8).map(d=>`<button data-art="${d}"><img src="${ART[d].src}" alt="${ART[d].title||d}"><span>${ART[d].title||d}</span></button>`).join("")}</div>`;
}
function jump(){
  let h='<nav class="jump" aria-label="Jump to century"><button data-today>Today</button><button data-full aria-pressed="'+full+'">Full timeline</button>';
  for(let c=100;c<=2000;c+=100)h+=`<button data-jump="${c}" aria-pressed="${!full&&c==curC}">${c}s</button>`;
  return h+"</nav>";
}
function pn(a,b){return `<div class="pn">${a?`<button data-nav="${a[0]}|${a[1]}">\u2039 ${a[2]}</button>`:"<span></span>"}${b?`<button data-nav="${b[0]}|${b[1]}">${b[2]} \u203A</button>`:"<span></span>"}</div>`}
function onClick(e){
  const t=e.target.closest("[data-page],[data-set],[data-back],[data-zoom],[data-ref],[data-jump],[data-full],[data-today],[data-art],[data-nav]");if(!t)return;
  if(t.dataset.page){nav(t.dataset.page);return}
  if(t.dataset.set!==undefined){setIdx=+t.dataset.set;render();scrollTo(0,0);return}
  if("back" in t.dataset){setIdx=null;render();scrollTo(0,0);return}
  if(t.dataset.ref!==undefined){const L=lbList();const k=L.findIndex(x=>x.i===+t.dataset.ref);showLb(Math.max(k,0));if(!$("lb").open)$("lb").showModal();return}
  if(t.dataset.zoom!==undefined){showLb(+t.dataset.zoom);if(!$("lb").open)$("lb").showModal();return}
  if(t.dataset.jump){page="timeline";curC=+t.dataset.jump;full=false;st={y:null,m:null};render();scrollTo(0,0)}
  else if("full" in t.dataset){const was=page==="timeline"&&full;page="timeline";full=!was;st={y:null,m:null};render();scrollTo(0,0)}

}
main.addEventListener("click",onClick);
function go(y,m){
  if(st.y==null&&y!=null)tlScroll=scrollY;

}
function search(){return `<form class="find" id="find"><label for="yr">Go to year</label><input id="yr" type="number" min="100" max="${NOW}" inputmode="numeric" placeholder="1776"><button class="btn">Go</button></form>`}
main.addEventListener("submit",e=>{
  if(e.target.id!=="find")return;e.preventDefault();
  const i=document.getElementById("yr");
  if(!i.checkValidity()||!i.value){i.reportValidity();return}
  go(+i.value,null);
});
function renderTimeline(){
  const {y,m}=st;

  add("Home",()=>nav("home"));
  add("Timeline",()=>go(null,null));
  if(y!=null)add(y,()=>go(y,null));
  if(m!=null)add(MN[m],()=>go(y,m));
  if(y==null)return timeline();
  m==null?year(y):month(y,m);
}
function timeline(){
  if(full)return fullView();
  let h=featured()+search();
  for(const c of [curC]){
    h+=`<h2 class="c" id="c${c}">${c}'s</h2><div class="tl">`;
    for(let i=0;i<100;i++){
      const y=c+i;if(y>NOW)break;const ev=byYear[y];
      h+=`<button class="yb${ev?" ev":""}${hasArt(y)?" art":""}" data-y="${y}" aria-label="${y}${ev?": "+ev.join(", "):""}"><b>${y}</b>${ev?`<small>${ev.join(", ")}</small>`:""}</button>`;
    }
    h+="</div>";
  }
  main.innerHTML=h;
  main.querySelectorAll(".yb").forEach(b=>b.onclick=()=>go(+b.dataset.y,null));
}
function year(y){
  const ev=byYear[y];
  let h=`<h2 class="c" style="text-align:left;margin-top:12px">${y}${ev?" · "+ev.join(", "):""}</h2><div class="months">`;
  for(let mo=0;mo<12;mo++)h+=`<button class="m" data-m="${mo}"><h3>${MN[mo]}</h3><div class="dgrid">${WD.map(d=>`<span>${d}</span>`).join("")}${cells(y,mo,(d)=>`<div>${d}</div>`)}</div></button>`;
  main.innerHTML=pn(y>100?[y-1,"",y-1]:null,y<NOW?[y+1,"",y+1]:null)+h+"</div>";
  main.querySelectorAll(".m").forEach(b=>b.onclick=()=>go(y,+b.dataset.m));
}
function cells(y,m,f){
  const dt=new Date(2000,m,1);dt.setFullYear(y);
  const first=dt.getDay(),n=new Date(2000,m+1,0).getDate();
  const len=new Date(Date.UTC(2000,m+1,0));let days=new Date(y,m+1,0).getDate();
  if(y<100)days=n;
  let s="<i></i>".repeat(first);for(let d=1;d<=days;d++)s+=f(d);return s;
}
function month(y,m){
  let h=`<div class="big"><h2 class="c" style="text-align:left;margin-top:12px">${MN[m]} ${y}</h2><div class="dgrid">${WD.map(d=>`<div class="hd">${d}</div>`).join("")}`;
  h+=cells(y,m,d=>`<button class="d${ART[key(y,m,d)]?" art":""}" data-d="${d}" aria-label="${MN[m]} ${d}, ${y}">${d}</button>`);

}
function showArt(){
  const a=ART[cur.k];

function day(y,m,d){

  pencil:{title:"#2 Pencil Drawings",kind:"drawing",items:[{title:"801-899 E Grace St, Richmond, VA, United States",cover:"images/pencil/pencil-1-art.png",art:"images/pencil/pencil-1-art.png",ref:"images/pencil/pencil-1-ref.jpg"},{title:"E Main St, Richmond, VA, United States",cover:"images/pencil/pencil-2-art.png",art:"images/pencil/pencil-2-art.png",ref:"images/pencil/pencil-2-ref.jpg"},{title:"E Franklin St, Richmond, VA, United States",cover:"images/pencil/pencil-3-art.png",art:"images/pencil/pencil-3-art.png",ref:"images/pencil/pencil-3-ref.jpg"},{title:"Drawing 4",cover:"images/pencil/pencil-4-art.png",art:"images/pencil/pencil-4-art.png"},{title:"Drawing 5",cover:"images/pencil/pencil-5-art.png",art:"images/pencil/pencil-5-art.png"},{title:"Drawing 6",cover:"images/pencil/pencil-6-art.png",art:"images/pencil/pencil-6-art.png"},{title:"Drawing 7",cover:"images/pencil/pencil-7-art.png",art:"images/pencil/pencil-7-art.png"},{title:"Drawing 8",cover:"images/pencil/pencil-8-art.png",art:"images/pencil/pencil-8-art.png"},{title:"Drawing 9",cover:"images/pencil/pencil-9-art.png",art:"images/pencil/pencil-9-art.png"},{title:"Drawing 10",cover:"images/pencil/pencil-10-art.png",art:"images/pencil/pencil-10-art.png"},{title:"Tree Bird",date:"March 30, 2026 1:42 p.m.",cover:"images/pencil/pencil-11-art.png",art:"images/pencil/pencil-11-art.png",ref:"images/pencil/pencil-11-ref.jpg"},{title:"Drawing 12",cover:"images/pencil/pencil-12-art.png",art:"images/pencil/pencil-12-art.png"}]},
  vlog:{title:"Dri's Weekly Vlog",kind:"video",items:[]},
  variety:{title:"Dri's Variety Show",kind:"video",items:[]},
  writers:{title:"Writer's Board",kind:"writing",items:[{title:"What Is Steven Saying?",body:"Disclosure Day wasn't the first clue. He's been saying something for a while. So, do aliens exist?"}]}
};
const cnt=p=>{const s=SECTIONS[p];return s.sets?s.sets.reduce((a,x)=>a+x.items.length,0):s.items.length};
const PAGES=[["home","Home"],["timeline","Timeline"],["pictures","Pictures"],["printing","3D Printing"],["music","Music"],["film","Film"],["pencil","#2 Pencil Drawings"],["vlog","Dri's Weekly Vlog"],["variety","Dri's Variety Show"],["writers","Writer's Board"]];
function drawSide(){
  $("side").innerHTML=PAGES.map(([p,t])=>{
    let h=`<button data-page="${p}"${p===page?' aria-current="page"':""}>${t}</button>`;
    if(p==="timeline"&&(page==="timeline"||page==="home")){
      h+='<div class="cent"><button class="wide" data-today style="--c:#0bda51">Today</button><button class="wide" data-full aria-pressed="'+full+'" style="--c:#0bda51">Full timeline</button>';
      for(let c=100;c<=2000;c+=100)h+=`<button data-jump="${c}" aria-pressed="${!full&&c==curC}" style="--c:${hue(c)}">${c}s</button>`;
      h+="</div>";
    }
    return h;
  }).join("");
}
function nav(p){page=p;setIdx=null;if(p==="timeline")st={y:null,m:null};render();scrollTo(0,0)}
function render(){
  if(window.__v3d)window.__v3d.disposeAll();
  drawSide();
  if(page!=="timeline")main.style.setProperty("--c",PAGE_HUE[page]||"#0bda51");
  if(page==="timeline")return renderTimeline();
  crumbs.innerHTML="";
  page==="home"?home():section(page);
}
function home(){
  main.innerHTML='<div class="home">'+PAGES.slice(1).map(([p,t])=>{
    const n=p==="timeline"?"Every year since 100 A.D.":(cnt(p)?cnt(p)+(cnt(p)>1?" items":" item"):"Coming soon");
    return `<button class="box${p==="timeline"?" tlb":""}" data-page="${p}" style="--c:${PAGE_HUE[p]}"><b>${t}</b><small>${n}</small></button>`}).join("")+"</div>";
}
function card(s,it,i){
  const t=it.title?`<figcaption><b>${it.title}</b>${it.date?`<small class="dt2">${it.date}</small>`:""}${it.desc?`<p class="ds">${it.desc}</p>`:""}</figcaption>`:"";
  if(/youtube\.com\/embed|player\.vimeo\.com|open\.spotify\.com\/embed/.test(it.src))return `<figure><iframe src="${it.src}" allowfullscreen loading="lazy" title="${it.title||s.title}"></iframe>${t}</figure>`;
  if(s.kind==="audio")return `<figure><audio controls src="${it.src}"></audio>${t}</figure>`;
  if(s.kind==="video")return `<figure><video controls playsinline src="${it.src}"></video>${t}</figure>`;
  return `<figure><img src="${it.src}" alt="${it.title||s.title}" data-zoom="${i}" loading="lazy">${t}</figure>`;
}
async function modelSection(p){
  const s=SECTIONS[p];
  if(!s.items.length){main.innerHTML=`<h2 class="c">${s.title}</h2><div class="empty">Nothing here yet.</div>`;return}
  if(setIdx==null){
    main.innerHTML=`<h2 class="c">${s.title}</h2><div class="covers multi">`+s.items.map((it,i)=>`<button class="cover mcover" data-set="${i}" aria-label="Open ${it.title}"><img src="${it.cover}" alt="${it.title}" draggable="false"><span class="cap"><b>${it.title}</b><small>3D model &middot; tap to open</small></span></button>`).join("")+"</div>";
    return;
  }
  const it=s.items[setIdx],i=setIdx;
  main.innerHTML=`<div class="pn"><button data-back>&lsaquo; ${s.title}</button><span></span></div><article class="mdl"><div class="stage" data-i="${i}"><span class="hint">Drag to turn &middot; scroll to zoom</span></div><aside>${it.ref?`<button class="ref" data-ref="${i}" aria-label="View reference photo"><img src="${it.ref}" alt="${it.title} reference" loading="lazy" draggable="false"></button>`:""}<h3>${it.title}${it.date?` <em class="dt">${it.date}</em>`:""}</h3>${it.desc?`<p class="ds">${it.desc}</p>`:""}</aside></article>`;
  const fail=el=>el.innerHTML='<span class="hint" style="opacity:1">3D view unavailable on this device.</span>';
  try{
    const v=window.__v3d||(window.__v3d=await import("./vendor/viewer.js"));
    if(page!==p||setIdx!==i)return;
    const el=document.querySelector(".stage"); v.mount(el,it.model).catch(()=>fail(el));
  }catch(e){document.querySelectorAll(".stage").forEach(fail)}
}
function drawingSection(p){
  const s=SECTIONS[p];
  if(!s.items.length){main.innerHTML=`<h2 class="c">${s.title}</h2><div class="empty">Nothing here yet.</div>`;return}
  if(setIdx==null){
    main.innerHTML=`<h2 class="c">${s.title}</h2><div class="covers multi">`+s.items.map((it,i)=>`<button class="cover mcover dcover" data-set="${i}" aria-label="Open ${it.title}"><img src="${it.cover}" alt="${it.title}" draggable="false"><span class="cap"><b>${it.title}${it.date?` <em class="dt">${it.date}</em>`:""}</b><small>tap to open</small></span></button>`).join("")+"</div>";
    return;
  }
  const it=s.items[setIdx],i=setIdx;
  main.innerHTML=`<div class="pn"><button data-back>&lsaquo; ${s.title}</button><span></span></div><article class="mdl${it.ref?"":" solo"}"><div class="stage art"><img src="${it.art}" alt="${it.title}" draggable="false"></div><aside>${it.ref?`<button class="ref" data-ref="${i}" aria-label="View reference photo"><img src="${it.ref}" alt="${it.title} on paper" draggable="false"></button>`:""}<h3>${it.title}${it.date?` <em class="dt">${it.date}</em>`:""}</h3>${it.desc?`<p class="ds">${it.desc}</p>`:""}</aside></article>`;
}
function writingSection(p){
  const s=SECTIONS[p];
  if(!s.items.length){main.innerHTML=`<h2 class="c">${s.title}</h2><div class="empty">Nothing here yet.</div>`;return}
  const esc=t=>String(t).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
  if(setIdx==null){
    main.innerHTML=`<h2 class="c">${s.title}</h2><div class="covers multi">`+s.items.map((it,i)=>`<button class="cover wcover" data-set="${i}" aria-label="Open ${esc(it.title)}"><span class="cap"><b>${esc(it.title)}${it.date?` <em class="dt">${it.date}</em>`:""}</b><small>${esc((it.body||"").slice(0,90))}${(it.body||"").length>90?"\u2026":""}</small></span></button>`).join("")+"</div>";
    return;
  }
  const it=s.items[setIdx];
  main.innerHTML=`<div class="pn"><button data-back>&lsaquo; ${s.title}</button><span></span></div><article class="post"><h2 class="c" style="margin-top:0">${esc(it.title)}</h2>${it.date?`<p class="dt" style="text-align:center">${it.date}</p>`:""}<div class="body">${(it.body||"").split(/\n\s*\n/).map(x=>`<p>${esc(x).replace(/\n/g,"<br>")}</p>`).join("")}</div>
    <section class="cmts"><h3>Comments${(it.comments||[]).length?` <small>${it.comments.length}</small>`:""}</h3>
    ${(it.comments||[]).length?`<ul>${it.comments.map(c=>`<li><p>${esc(c.text).replace(/\n/g,"<br>")}</p><small>Anonymous${c.date?` &middot; ${esc(c.date)}`:""}</small></li>`).join("")}</ul>`:'<p class="none">No comments yet. Be the first.</p>'}
    <form class="cform" name="comments" method="POST"><input type="hidden" name="form-name" value="comments"><input type="hidden" name="post" value="${esc(it.title)}"><p class="hp"><label>Leave empty <input name="bot-field" tabindex="-1" autocomplete="off"></label></p>
    <label for="cmt">Add a comment <small>(anonymous, no name or email needed)</small></label>
    <textarea id="cmt" name="comment" rows="4" maxlength="1000" required placeholder="Share your thoughts..."></textarea>
    <div class="crow"><button class="btn" type="submit">Post anonymously</button><span class="cmsg" role="status"></span></div>
    <p class="cnote">Comments are reviewed before they appear.</p></form></section></article>`;
  const f=main.querySelector(".cform"),box=main.querySelector(".cmts");
  const draw=extra=>{const all=(it.comments||[]).concat(extra||[]);
    box.querySelector("h3").innerHTML="Comments"+(all.length?` <small>${all.length}</small>`:"");
    let ul=box.querySelector("ul"),none=box.querySelector(".none");
    if(!all.length)return;
    if(none)none.remove();
    if(!ul){ul=document.createElement("ul");box.querySelector("h3").after(ul)}
    ul.innerHTML=all.map(c=>`<li><p>${esc(c.text).replace(/\n/g,"<br>")}</p><small>Anonymous${c.date?` &middot; ${esc(String(c.date).slice(0,10))}`:""}</small></li>`).join("")};
  fetch("/api/comments?post="+encodeURIComponent(it.title)).then(r=>r.ok?r.json():[]).then(l=>{if(Array.isArray(l)&&l.length&&box.isConnected)draw(l)}).catch(()=>{});
  f.onsubmit=async e=>{e.preventDefault();const m=f.querySelector(".cmsg"),b=f.querySelector("button");
    if(!f.comment.value.trim())return;b.disabled=true;m.textContent="Sending...";
    try{const r=await fetch("/api/comments",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({post:it.title,text:f.comment.value,hp:f["bot-field"].value})});
      if(!r.ok)throw 0;
      fetch("/",{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded"},body:new URLSearchParams(new FormData(f)).toString()}).catch(()=>{});
      f.comment.value="";m.textContent="Thank you! Your comment will appear after it is approved."}
    catch(_){m.textContent="Sorry, that did not send. Please try again."}b.disabled=false};
}
function section(p){
  const s=SECTIONS[p];
  if(s.sets)return imgSection(p);
  if(s.kind==="model")return modelSection(p);
  if(s.kind==="drawing")return drawingSection(p);
  if(s.kind==="writing")return writingSection(p);
  if(!s.items.length){main.innerHTML=`<h2 class="c">${s.title}</h2><div class="empty">Nothing here yet.</div>`;return}
  main.innerHTML=`<h2 class="c">${s.title}</h2><div class="gal">${s.items.map((it,i)=>card(s,it,i)).join("")}</div>`;
}
function imgSection(p){
  const s=SECTIONS[p],sets=s.sets.map((x,i)=>({...x,i})).filter(x=>x.items.length);
  const th=it=>it.thumb||it.src;
  if(!sets.length){main.innerHTML=`<h2 class="c">${s.title}</h2><div class="empty">Nothing here yet.</div>`;return}
  if(setIdx==null){
    main.innerHTML=`<h2 class="c">${s.title}</h2><div class="covers${sets.length>1?" multi":""}">`+sets.map(x=>{
      const c=x.items[0],n=x.items.length;
      return `<button class="cover" data-set="${x.i}" aria-label="Open ${x.title}, ${n} photo${n>1?"s":""}"><img src="${th(c)}" alt="${c.title||x.title}" draggable="false"><span class="cap"><b>${x.title}${x.date?` <em class="dt">${x.date}</em>`:""}</b><small>${n} photo${n>1?"s":""} · tap to open</small></span></button>`}).join("")+"</div>";
    return;
  }
  const x=s.sets[setIdx];
  main.innerHTML=`<div class="pn"><button data-back>‹ ${s.title}</button><span></span></div><h2 class="c" style="margin-top:0">${x.title}${x.date?` <em class="dt">${x.date}</em>`:""}</h2><div class="album">${x.items.map((it,i)=>`<button class="thumb" data-zoom="${i}" aria-label="${it.title||"Photo "+(i+1)}"><img src="${th(it)}" alt="${it.title||x.title}" loading="lazy" draggable="false"></button>`).join("")}</div>`;
}
function lbList(){const s=SECTIONS[page];return (s.kind==="model"||s.kind==="drawing")?s.items.map((x,i)=>({i,src:x.ref,title:x.title})).filter(x=>x.src):s.sets[setIdx].items}
function showLb(i){
  const items=lbList();if(!items.length)return;
  lbIndex=(i+items.length)%items.length;const it=items[lbIndex];
  $("lbi").src=it.src;$("lbi").alt=it.title||SECTIONS[page].title;
  $("lbc").textContent=(it.title?it.title+" · ":"")+(lbIndex+1)+" / "+items.length;
}
const lbStep=d=>showLb(lbIndex+d);
$("side").addEventListener("click",e=>{
  const b=e.target.closest("[data-page]");
  if(b)nav(b.dataset.page);else onClick(e);
  if(isMobile()&&e.target.closest("button"))setSide(false);
});
const isMobile=()=>matchMedia("(max-width:800px)").matches;
function setSide(open){
  document.body.classList.toggle("side-closed",!open);
  const b=$("menu");b.textContent=open?"\u2715 Close":"\u2630 Menu";b.setAttribute("aria-expanded",open);
  try{localStorage.setItem("side",open?"1":"0")}catch(_){}
}
$("menu").onclick=()=>setSide(document.body.classList.contains("side-closed"));
main.addEventListener("click",()=>{if(isMobile()&&!document.body.classList.contains("side-closed"))setSide(false)},true);
{let o=!isMobile();try{const v=localStorage.getItem("side");if(v!==null&&!isMobile())o=v==="1"}catch(_){}setSide(o)}
$("lbx").onclick=()=>$("lb").close();
$("lbp").onclick=()=>lbStep(-1);$("lbn").onclick=()=>lbStep(1);
$("lb").addEventListener("click",e=>{if(e.target===$("lb"))$("lb").close()});
function fullView(){
  let h=search()+'<h2 class="c">Full timeline</h2><div class="full">';
  for(let c=100;c<=2000;c+=100){
    h+=`<section class="cs"><h3>${c}s</h3><div class="mini">`;
    for(let i=0;i<100;i++){
      const y=c+i;if(y>NOW)break;const ev=byYear[y];
      h+=`<button class="mb${ev?" ev":""}${hasArt(y)?" art":""}" data-y="${y}" title="${y}${ev?" \u00b7 "+ev.join(", "):""}" aria-label="${y}${ev?": "+ev.join(", "):""}">${String(i).padStart(2,"0")}</button>`;
    }
    h+="</div></section>";
  }
  main.innerHTML=h+"</div>";
  main.querySelectorAll(".mb").forEach(b=>b.onclick=()=>go(+b.dataset.y,null));
}
$("foot").innerHTML="\u00a9 "+new Date().getFullYear()+" The Icosahedron Effect. All rights reserved. Please don't copy or reuse the art without permission.<br>Website built with AI assistance. All artwork is my own.";
const reduce=matchMedia("(prefers-reduced-motion:reduce)").matches;
function step(dir){
  if(page!=="timeline")return;
  if(st.y==null){if(full)return;const c=curC+dir*100;if(c>=100&&c<=2000){curC=c;render()}}
  else if(st.m==null){const y=st.y+dir;if(y>=100&&y<=NOW)go(y,null)}
  else{let y=st.y,m=st.m+dir;if(m<0){m=11;y--}if(m>11){m=0;y++}if(y>=100&&y<=NOW)go(y,m)}
}
function stepDay(dir){
  const d=new Date(2000,cur.m,cur.d);d.setFullYear(cur.y);d.setDate(d.getDate()+dir);
  const y=d.getFullYear(),m=d.getMonth();if(y<100||y>NOW)return;
  if(st.m!=null&&(st.y!==y||st.m!==m)){st={y,m};curC=Math.floor(y/100)*100;render()}
  day(y,m,d.getDate());
}
$("pd").onclick=()=>stepDay(-1);$("nd").onclick=()=>stepDay(1);
document.addEventListener("keydown",e=>{
  if(e.key!=="ArrowLeft"&&e.key!=="ArrowRight")return;
  if(/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)||e.metaKey||e.ctrlKey||e.altKey)return;
  const dir=e.key==="ArrowLeft"?-1:1;
  if($("lb").open){lbStep(dir);return}
  dlg.open?stepDay(dir):step(dir);
});
function swipe(el,fn){
  let x=0,y=0,ok=false;
  el.addEventListener("touchstart",e=>{ok=!e.target.closest(".jump");x=e.touches[0].clientX;y=e.touches[0].clientY},{passive:true});
  el.addEventListener("touchend",e=>{
    if(!ok)return;const t=e.changedTouches[0],dx=t.clientX-x,dy=t.clientY-y;
    if(Math.abs(dx)>60&&Math.abs(dx)>1.5*Math.abs(dy))fn(dx>0?-1:1);
  },{passive:true});
}
swipe(main,step);swipe(dlg,stepDay);swipe($("lb"),lbStep);
const topBtn=$("top");
addEventListener("scroll",()=>{topBtn.hidden=scrollY<600},{passive:true});
topBtn.onclick=()=>scrollTo({top:0,behavior:reduce?"auto":"smooth"});
render();
</script>
