<!doctype html><html><head><meta charset="utf-8"><meta name="robots" content="noindex"><style>html,body{margin:0;height:100%;background:transparent;overflow:hidden}canvas{display:block;width:100%;height:100%}</style></head><body><canvas id="c"></canvas>
<script type="module">
import * as T from './vendor/three.module.min.js';
let kb=[],ms2=[];const mode=new URLSearchParams(location.search).get('m')||'camera';
const cv=document.getElementById('c');
const r=new T.WebGLRenderer({canvas:cv,antialias:true,alpha:true});r.setPixelRatio(Math.min(devicePixelRatio,2));
const scene=new T.Scene(),cam=new T.PerspectiveCamera(30,1,.1,50);cam.position.set(0,0,mode==="birds"?7:mode==="camera"?6.6:mode==="keyboard"?7.6:7.4);
const LINE=new T.LineBasicMaterial({color:0x62d860});
const fm=c=>new T.MeshBasicMaterial({color:c,polygonOffset:true,polygonOffsetFactor:1,polygonOffsetUnits:1});
const BODY=fm(0x0b4a2a);
{const c=document.createElement('canvas');c.width=c.height=128;const x=c.getContext('2d'),gr=x.createRadialGradient(64,64,4,64,64,64);gr.addColorStop(0,'rgba(98,216,96,.30)');gr.addColorStop(1,'rgba(98,216,96,0)');x.fillStyle=gr;x.fillRect(0,0,128,128);
 const gl=new T.Mesh(new T.PlaneGeometry(4.6,4.6),new T.MeshBasicMaterial({map:new T.CanvasTexture(c),transparent:true,depthWrite:false}));gl.position.z=-3;if(mode!=='birds')scene.add(gl)}
const root=new T.Group(),g=new T.Group();root.add(g);scene.add(root);
function part(geo,x,y,z,fill=BODY,rot,parent=g){const m=new T.Mesh(geo,fill);m.position.set(x,y,z);if(rot)m.rotation.set(rot[0],rot[1],rot[2]);m.add(new T.LineSegments(new T.EdgesGeometry(geo,25),LINE));parent.add(m);return m}
const box=(w,h,d)=>new T.BoxGeometry(w,h,d),cyl=(a,b,h,s=40)=>new T.CylinderGeometry(a,b,h,s),X=[Math.PI/2,0,0];
if(mode==='camera'){
 // Canon-style DSLR (Rebel T7 layout), facing +z
 part(box(2.2,1.4,.9),0,0,0);
 part(box(.62,1.4,.55),-.78,0,.62);                 // right-hand grip
 part(box(.86,.36,.7),.22,.88,-.05);                // pentaprism hump
 part(box(.42,.16,.34),.22,1.14,.02,fm(0x0f5c34));  // built-in flash
 part(cyl(.17,.17,.1),.86,.74,-.1,fm(0x0f5c34));    // mode dial
 part(cyl(.09,.09,.08),-.72,.74,.2,fm(0x1f7a44));   // shutter button
 part(box(.5,.12,.1),.25,.52,.46,fm(0x0f5c34));     // front badge strip
 const lx=.22,ly=.02;
 part(cyl(.66,.66,.12),lx,ly,.5,fm(0x0f5c34),X);    // mount
 part(cyl(.54,.54,.6),lx,ly,.86,fm(0x07331c),X);    // barrel
 part(cyl(.58,.58,.42),lx,ly,1.35,fm(0x0a4a2a),X);  // zoom ring
 for(let i=0;i<6;i++)part(cyl(.595,.595,.03,40),lx,ly,1.2+i*.06,fm(0x02150b),X); // grip ribs
 part(cyl(.48,.48,.3),lx,ly,1.7,fm(0x07331c),X);    // front section
 part(cyl(.36,.36,.06),lx,ly,1.88,fm(0x1c8a4a),X);  // glass
 part(cyl(.18,.18,.04),lx,ly,1.92,fm(0x0b4a2a),X);  // inner element
 g.rotation.x=.18;
}else if(mode==='birds'){
 // flock like the one in the Edgewood video: V of small birds drifting across the sky
 const N=[[0,0],[-.55,.32],[.55,.32],[-1.1,.64],[1.1,.64],[-1.65,.96],[1.65,.96]];
 const flock=new T.Group();g.add(flock);
 var birds=N.map(([x,y],i)=>{const geo=new T.BufferGeometry();geo.setAttribute('position',new T.BufferAttribute(new Float32Array(15),3));
  const l=new T.Line(geo,new T.LineBasicMaterial({color:0x62d860}));l.position.set(x*.9,y*.9,0);l.userData={ph:i*.7};flock.add(l);return l});
 var flockG=flock;
}else if(mode==='model'){
 const src=new URLSearchParams(location.search).get('src');
 fetch(src).then(r=>r.arrayBuffer()).then(b=>{const u=new Uint32Array(b,0,2),nv=u[0],nf=u[1];const pos=new Float32Array(b,8,nv*3),idx=new Uint32Array(b,8+nv*12,nf*3);
  const geo=new T.BufferGeometry();geo.setAttribute('position',new T.BufferAttribute(pos,3));geo.setIndex(new T.BufferAttribute(idx,1));
  const m=part(geo,0,0,0);m.scale.setScalar(1.7)});
 g.rotation.x=.25;
}else if(mode==='keyboard'){
 part(box(3.3,.16,1.25),-.35,0,0);
 const KF=fm(0x0f5c34);const keys=[],mouse=[];kb=keys;ms2=mouse;
 for(let r=0;r<4;r++){const n=r===3?0:11-(r===2?1:0);for(let c=0;c<n;c++)keys.push(part(box(.24,.1,.24),-1.85+c*.28+(r===2?.14:r===1?.07:0),.12,-.45+r*.28,KF))}
 part(box(1.3,.1,.24),-.55,.12,.39,KF);          // space bar
 part(box(.34,.1,.24),-1.8,.12,.39,KF);part(box(.34,.1,.24),.7,.12,.39,KF);
 for(let c=0;c<3;c++)part(box(.24,.1,.24),.98+c*.0,.12,-.45+c*.28,KF); // side keys
 g.rotation.x=.62;g.position.x=0;
}else{
 // #2 pencil
 part(cyl(.38,.38,3.6,6),0,0,0);
 part(cyl(.41,.41,.46,28),0,2.03,0,fm(0x2e6b4f));
 for(const y of[1.9,2.03,2.16])part(cyl(.415,.415,.03,28),0,y,0,fm(0x02150b));
 part(cyl(.36,.36,.46,28),0,2.49,0,fm(0x1f7a44));
 part(cyl(.38,.1,.72,6),0,-2.16,0,fm(0x3a8f5a));
 part(cyl(.1,0.001,.3,6),0,-2.67,0,fm(0x02150b));
 const c2=document.createElement('canvas');c2.width=128;c2.height=512;const x=c2.getContext('2d');x.translate(64,256);x.rotate(-Math.PI/2);x.fillStyle='#62d860';x.font='800 64px Inter,system-ui,sans-serif';x.textAlign='center';x.textBaseline='middle';x.fillText('No. 2',0,0);
 const tx=new T.CanvasTexture(c2);tx.colorSpace=T.SRGBColorSpace;
 const lab=new T.Mesh(new T.PlaneGeometry(.34,1.36),new T.MeshBasicMaterial({map:tx,transparent:true}));
 const ap=.38*Math.cos(Math.PI/6)+.004;lab.position.set(ap*Math.sin(Math.PI/6),.1,ap*Math.cos(Math.PI/6));lab.rotation.y=Math.PI/6;g.add(lab);
 root.rotation.z=.9;root.scale.setScalar(.7);
}
function size(){const w=cv.clientWidth,h=cv.clientHeight;if(cv.width!==Math.round(w*r.getPixelRatio())){r.setSize(w,h,false);cam.aspect=w/h;cam.updateProjectionMatrix()}}
(function loop(t){const f=(t||0)*.001;size();
 root.position.y=Math.sin(f*1.1)*.16;
 if(mode==='birds'){const T0=(f*.2)%1;flockG.position.set(-5.4+T0*10.8,-.35+Math.sin(f*.9)*.25+(T0-.5)*-.5,0);flockG.rotation.z=-.08;
  birds.forEach(b=>{const w=Math.sin(f*7+b.userData.ph)*.2,p=b.geometry.attributes.position;p.setXYZ(0,-.36,w,0);p.setXYZ(1,-.17,w*.35+.07,0);p.setXYZ(2,0,-.03,0);p.setXYZ(3,.17,w*.35+.07,0);p.setXYZ(4,.36,w,0);p.needsUpdate=true;b.position.y+=Math.sin(f*1.3+b.userData.ph)*.0015})}else if(mode==='model'){g.rotation.y=f*.45}else if(mode==='keyboard'){kb.forEach((k,i)=>{k.position.y=.12+Math.max(0,Math.sin(f*2.6-k.position.x*1.6-k.position.z*1.2))*.07});g.rotation.y=-.35+Math.sin(f*.6)*.45;root.rotation.z=Math.sin(f*.8)*.03}else if(mode==='camera'){g.rotation.y=-.55+Math.sin(f*.55)*.75;root.rotation.z=Math.sin(f*.8)*.04}else{g.rotation.y=f*.5;root.rotation.z=.9+Math.sin(f*.9)*.05}
 r.render(scene,cam);requestAnimationFrame(loop)})();
</script></body></html>
