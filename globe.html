<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex">
<title>Globe timeline — prototype</title>
<style>
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% 35%,#0a4a2c,#02150b 75%);color:#e9fff0;font-family:Inter,system-ui,sans-serif;min-height:100vh;overflow-x:hidden}
h1{margin:18px 0 0;text-align:center;font-size:1.1rem;letter-spacing:.12em;text-transform:uppercase;color:#62d860}
#stage{position:relative;height:56vh;min-height:330px}canvas{display:block;width:100%;height:100%;cursor:grab}
#ctl{max-width:720px;margin:0 auto;padding:0 18px 30px;text-align:center}
#yr{width:190px;font:800 3.4rem/1 Inter,system-ui,sans-serif;background:transparent;color:#62d860;border:0;border-bottom:2px solid #62d860;text-align:center;outline:0;-moz-appearance:textfield}
#yr::-webkit-inner-spin-button{display:none}
.sub{opacity:.7;margin:6px 0 14px;font-size:.9rem}
input[type=range]{width:100%;accent-color:#62d860;height:28px}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:8px 0 18px}
.chips button{background:#0e3b24;color:#e9fff0;border:0;border-radius:10px;padding:8px 12px;font:600 .85rem inherit;cursor:pointer}
.chips button:hover,.chips button.on{outline:2px solid #62d860;background:#145a36}
#ev{text-align:left;display:grid;gap:8px}
.card{background:#0c3a23;border-radius:12px;padding:10px 14px}.card b{display:block}.card small{opacity:.75}
.none{opacity:.6;text-align:center}
#tip{position:absolute;pointer-events:none;background:#02150bcc;border:1px solid #62d860;border-radius:8px;padding:4px 9px;font-size:.8rem;display:none;white-space:nowrap}
</style></head><body>
<h1 id="h">The Icosahedron Effect · Globe timeline</h1><script>if(top!==self)document.getElementById("h").style.display="none"</script>
<div id="stage"><canvas id="c"></canvas><div id="tip"></div></div>
<div id="ctl">
<input id="yr" type="number" min="100" max="2026" value="1995" aria-label="Year">
<div class="sub" id="era"></div>
<input id="sl" type="range" min="1900" max="2026" value="1995" aria-label="Year slider">
<div class="chips" id="chips"></div>
<div id="ev"></div>
</div>
<script type="module">
import * as T from './vendor/three.module.min.js';
const PINS=[
{y:1856,t:"Pottawatomie massacre",p:"Franklin County, Kansas",ll:[38.55,-95.25]},
{y:1859,t:"Raid on Harpers Ferry",p:"Harpers Ferry, Virginia",ll:[39.32,-77.73]},
{y:1865,t:"Ku Klux Klan formed",p:"Pulaski, Tennessee",ll:[35.2,-87.03]},
{y:1920,t:"Wall Street bombing",p:"New York City",ll:[40.71,-74.01]},
{y:1995,t:"Oklahoma City bombing",p:"Oklahoma City, Oklahoma",ll:[35.47,-97.52]},
{y:1996,t:"Centennial Olympic Park bombing",p:"Atlanta, Georgia",ll:[33.76,-84.39]},
{y:1975,t:"J. Edgar Hoover Building opens",p:"Washington, D.C.",ll:[38.894,-77.025]},
];
const ERAS=[[100,"Roman Empire at its height"],[500,"Early Middle Ages"],[1000,"High Middle Ages"],[1500,"Age of Exploration"],[1600,"Jamestown, Virginia founded 1607"],[1700,"Colonial era"],[1800,"Early Republic"],[1860,"Civil War era"],[1900,"Industrial age"],[1945,"Postwar & Cold War"],[1991,"Post–Cold War"],[2001,"Post-9/11"]];
const eraOf=y=>{let e=ERAS[0][1];for(const [a,b] of ERAS)if(y>=a)e=b;return e};
const cv=document.getElementById('c'),tip=document.getElementById('tip');
const r=new T.WebGLRenderer({canvas:cv,antialias:true,alpha:true});r.setPixelRatio(Math.min(devicePixelRatio,2));
const scene=new T.Scene(),cam=new T.PerspectiveCamera(36,1,.1,50);cam.position.set(0,0,4.1);
const grp=new T.Group();scene.add(grp);
grp.add(new T.Mesh(new T.SphereGeometry(1,64,48),new T.MeshBasicMaterial({color:0x0b5a33,transparent:true,opacity:.55})));
grp.add(new T.Mesh(new T.SphereGeometry(1.012,24,16),new T.MeshBasicMaterial({color:0x62d860,wireframe:true,transparent:true,opacity:.05})));
const halo=new T.Mesh(new T.SphereGeometry(1.14,48,32),new T.ShaderMaterial({transparent:true,side:T.BackSide,depthWrite:false,blending:T.AdditiveBlending,
 vertexShader:'varying vec3 n;void main(){n=normalize(normalMatrix*normal);gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}',
 fragmentShader:'varying vec3 n;void main(){float i=pow(.62-dot(n,vec3(0,0,1.)),3.);gl_FragColor=vec4(.38,.85,.38,1.)*i;}'}));scene.add(halo);
const ll2v=(lat,lon,R=1)=>{const a=(90-lat)*Math.PI/180,b=(lon+180)*Math.PI/180;return new T.Vector3(-R*Math.sin(a)*Math.cos(b),R*Math.cos(a),R*Math.sin(a)*Math.sin(b))};
const land=await (await fetch('globe-land.json')).json();
const lp=new Float32Array(land.length/2*3);for(let i=0;i<land.length;i+=2){ll2v(land[i+1],land[i],1.006).toArray(lp,i/2*3)}
const lg=new T.BufferGeometry();lg.setAttribute('position',new T.BufferAttribute(lp,3));
grp.add(new T.Points(lg,new T.PointsMaterial({color:0x7dff7a,size:.016,sizeAttenuation:true})));
const bd=await (await fetch('globe-borders.json')).json();const bp=[];
for(const L of bd)for(let i=2;i<L.length;i+=2){let x0=L[i-2],y0=L[i-1],x1=L[i],y1=L[i+1];if(Math.abs(x1-x0)>180)continue;const n=Math.max(1,Math.ceil(Math.hypot(x1-x0,y1-y0)/2));for(let k=0;k<n;k++){const a=ll2v(y0+(y1-y0)*k/n,x0+(x1-x0)*k/n,1.004),b=ll2v(y0+(y1-y0)*(k+1)/n,x0+(x1-x0)*(k+1)/n,1.004);bp.push(a.x,a.y,a.z,b.x,b.y,b.z)}}
const bg=new T.BufferGeometry();bg.setAttribute('position',new T.Float32BufferAttribute(bp,3));
grp.add(new T.LineSegments(bg,new T.LineBasicMaterial({color:0xb6ffb0,transparent:true,opacity:.32})));
const pinMeshes=[];
PINS.forEach(p=>{const m=new T.Mesh(new T.SphereGeometry(.028,12,8),new T.MeshBasicMaterial({color:0xffffff}));m.position.copy(ll2v(p.ll[0],p.ll[1],1.02));m.userData=p;grp.add(m);pinMeshes.push(m)});
grp.rotation.y=-1.0;grp.rotation.x=.3;
function size(){const w=cv.clientWidth,h=cv.clientHeight;r.setSize(w,h,false);cam.aspect=w/h;cam.updateProjectionMatrix()}addEventListener('resize',size);size();
let drag=false,lx=0,ly=0,vy=.0016,t0=0;
cv.addEventListener('pointerdown',e=>{drag=true;lx=e.clientX;ly=e.clientY;cv.style.cursor='grabbing'});
addEventListener('pointerup',()=>{drag=false;cv.style.cursor='grab'});
addEventListener('pointermove',e=>{if(drag){grp.rotation.y+=(e.clientX-lx)*.006;grp.rotation.x=Math.max(-1.2,Math.min(1.2,grp.rotation.x+(e.clientY-ly)*.006));lx=e.clientX;ly=e.clientY}});
function flyTo(ll){const tgt=Math.PI/2-(ll[1]+180)*Math.PI/180;let d=((tgt-grp.rotation.y)%(2*Math.PI)+3*Math.PI)%(2*Math.PI)-Math.PI;grp.userData.fy=grp.rotation.y+d;grp.userData.fx=ll[0]*Math.PI/180*.8}
const yr=document.getElementById('yr'),sl=document.getElementById('sl'),ev=document.getElementById('ev'),era=document.getElementById('era'),chips=document.getElementById('chips');
let year=1995;
function setYear(y){y=Math.max(100,Math.min(2026,Math.round(y)||year));year=y;yr.value=y;
 const lo=Math.floor(y/100)*100;sl.min=lo;sl.max=Math.min(lo+99,2026);sl.value=y;era.textContent=eraOf(y);
 chips.querySelectorAll('button').forEach(b=>b.classList.toggle('on',+b.dataset.c===lo));
 const now=PINS.filter(p=>p.y===y);
 pinMeshes.forEach(m=>{const p=m.userData,on=p.y===y,past=p.y<y;m.visible=p.y<=y;m.material.color.set(on?0xffffff:0x62d860);m.scale.setScalar(on?1.8:.8)});
 ev.innerHTML=now.length?now.map(p=>`<div class="card"><b>${p.t}</b><small>${y} · ${p.p}</small></div>`).join(''):`<div class="none">No entries of yours in ${y} yet. Pins from earlier years stay on the globe.</div>`;
 if(now[0])flyTo(now[0].ll)}
for(let c=1500;c<=2000;c+=100){const b=document.createElement('button');b.dataset.c=c;b.textContent=c+'s';b.onclick=()=>setYear(c+(year%100));chips.append(b)}
yr.addEventListener('change',()=>setYear(+yr.value));sl.addEventListener('input',()=>setYear(+sl.value));
addEventListener('keydown',e=>{if(document.activeElement===yr)return;if(e.key==='ArrowLeft')setYear(year-1);if(e.key==='ArrowRight')setYear(year+1)});
setYear(1995);
const ray=new T.Raycaster(),mv=new T.Vector2();
cv.addEventListener('pointermove',e=>{const b=cv.getBoundingClientRect();mv.set((e.clientX-b.left)/b.width*2-1,-(e.clientY-b.top)/b.height*2+1);ray.setFromCamera(mv,cam);const h=ray.intersectObjects(pinMeshes.filter(m=>m.visible))[0];if(h){tip.style.display='block';tip.style.left=e.clientX-b.left+12+'px';tip.style.top=e.clientY-b.top+12+'px';tip.textContent=h.object.userData.t+' · '+h.object.userData.y}else tip.style.display='none'});
(function loop(t){const f=(t||0)*.001;grp.position.y=Math.sin(f*1.1)*.035;
 if(grp.userData.fy!=null&&!drag){grp.rotation.y+=(grp.userData.fy-grp.rotation.y)*.06;grp.rotation.x+=(grp.userData.fx-grp.rotation.x)*.06;if(Math.abs(grp.userData.fy-grp.rotation.y)<.002)grp.userData.fy=null}
 else if(!drag)grp.rotation.y+=vy;
 r.render(scene,cam);requestAnimationFrame(loop)})();
</script></body></html>
