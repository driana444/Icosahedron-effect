<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex">
<title>Globe timeline — prototype</title>
<style>
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% 35%,#0a4a2c,#02150b 75%);color:#e9fff0;font-family:Inter,system-ui,sans-serif;min-height:100vh;overflow-x:hidden}
h1{margin:18px 0 0;text-align:center;font-size:1.1rem;letter-spacing:.12em;text-transform:uppercase;color:#62d860}
#stage{position:relative;height:70vh;min-height:380px}canvas{display:block;width:100%;height:100%;cursor:grab}
#ctl{max-width:720px;margin:0 auto;padding:0 18px 30px;text-align:center}
#yr{width:230px;font:800 3.4rem/1 Inter,system-ui,sans-serif;background:transparent;color:#62d860;border:0;border-bottom:2px solid #62d860;text-align:center;outline:0;-moz-appearance:textfield}
#yr::-webkit-inner-spin-button{display:none}
.sub{opacity:.7;margin:6px 0 14px;font-size:.9rem}
.row{display:flex;justify-content:center;align-items:center;gap:14px}.st{background:#0e3b24;color:#e9fff0;border:0;border-radius:12px;width:48px;height:48px;font-size:1.8rem;cursor:pointer}.st:hover{outline:2px solid #62d860}.lbl{font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;opacity:.6;margin-top:6px}.chips{gap:6px 10px}.chips.sq button{min-width:0;padding:4px 6px}.chips.sq,#chips{flex-wrap:wrap}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:8px 0 18px}
.chips button{background:none;color:#e9fff0;opacity:.65;border:0;border-bottom:2px solid transparent;border-radius:0;padding:4px 6px;font:600 .95rem Inter,system-ui,sans-serif;cursor:pointer}
.chips button:hover{opacity:1;color:#62d860}.chips button.on{opacity:1;color:#62d860;border-bottom-color:#62d860}
#ev{text-align:left;display:grid;gap:8px}
.card{background:#0c3a23;border-radius:12px;padding:10px 14px}.card b{display:block}.card small{opacity:.75}
.lab{position:absolute;max-width:230px;pointer-events:auto;z-index:2;background:#02150bdd;border:1px solid #62d860;border-radius:10px;padding:8px 11px;font-size:.8rem;line-height:1.35;transform:translate(14px,-50%)}.lab .more{display:none;margin-top:3px}.lab:hover{z-index:5}.lab:hover .more{display:block}.lab b{display:block;font-size:.9rem;color:#fff}.lab small{display:block;opacity:.75;margin-bottom:3px}.lab span{opacity:.92}
#tip{position:absolute;pointer-events:none;background:#02150bcc;border:1px solid #62d860;border-radius:8px;padding:4px 9px;font-size:.8rem;display:none;white-space:nowrap}
#src{text-align:left;margin-top:22px}#src h2{font-size:.8rem;letter-spacing:.12em;text-transform:uppercase;color:#62d860;margin:0 0 10px}.ev{background:#0c3a23;border-radius:12px;padding:10px 14px;margin-bottom:8px;font-size:.88rem}.ev p{margin:4px 0 6px}.ev small{opacity:.7}.cit{font-size:.75rem;opacity:.8;padding-left:1.4em;text-indent:-1.4em;margin-top:3px;word-break:break-word}.cit a{color:#8ff08c}.note{font-size:.72rem;opacity:.65;margin-top:10px}
</style></head><body>
<h1 id="h">The Icosahedron Effect · Globe timeline</h1><script>if(top!==self)document.getElementById("h").style.display="none"</script>
<div id="stage"><canvas id="c"></canvas><div id="tip"></div></div>
<div id="ctl">
<div class="row"><button class="st" id="prev" aria-label="Previous decade">‹</button><input id="yr" type="text" inputmode="numeric" value="1990s" aria-label="Decade" maxlength="5"><button class="st" id="next" aria-label="Next decade">›</button></div>
<div class="sub" id="era"></div><div class="sub" id="leg"><span style="color:#fff">●</span> Event &nbsp; <span style="color:#ffd24a">●</span> Group &nbsp; <span style="color:#ff8a5c">●</span> Person</div><div id="src"></div>


</div>
<script src="vendor/topojson-client.min.js"></script>
<script type="module">
import * as T from './vendor/three.module.min.js';
const DATA=await (await fetch("globe-events.json")).json();const PINS=DATA;
const DECS=[...new Set(PINS.map(p=>Math.floor(p.y/10)*10))].sort((a,b)=>a-b);const COL={Event:0xffffff,Group:0xffd24a,Person:0xff8a5c};
const cv=document.getElementById('c'),tip=document.getElementById('tip');
const r=new T.WebGLRenderer({canvas:cv,antialias:true,alpha:true});r.setPixelRatio(Math.min(devicePixelRatio,2));
const scene=new T.Scene(),cam=new T.PerspectiveCamera(36,1,.1,50);cam.position.set(0,0,4.1);
const grp=new T.Group();scene.add(grp);
grp.add(new T.Mesh(new T.SphereGeometry(1,64,48),new T.MeshBasicMaterial({color:0x0b5a33,transparent:true,opacity:.55})));
grp.add(new T.Mesh(new T.SphereGeometry(1.012,24,16),new T.MeshBasicMaterial({color:0x62d860,wireframe:true,transparent:true,opacity:.03})));
const halo=new T.Mesh(new T.SphereGeometry(1.14,48,32),new T.ShaderMaterial({transparent:true,side:T.BackSide,depthWrite:false,blending:T.AdditiveBlending,
 vertexShader:'varying vec3 n;void main(){n=normalize(normalMatrix*normal);gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}',
 fragmentShader:'varying vec3 n;void main(){float i=pow(.62-dot(n,vec3(0,0,1.)),3.);gl_FragColor=vec4(.38,.85,.38,1.)*i;}'}));scene.add(halo);
const ll2v=(lat,lon,R=1)=>{const a=(90-lat)*Math.PI/180,b=(lon+180)*Math.PI/180;return new T.Vector3(-R*Math.sin(a)*Math.cos(b),R*Math.cos(a),R*Math.sin(a)*Math.sin(b))};
const topo=await (await fetch('globe-countries.json')).json();
const W=4096,H=2048,cx=document.createElement('canvas');cx.width=W;cx.height=H;const g2=cx.getContext('2d');
g2.fillStyle='#0a5230';g2.fillRect(0,0,W,H);
const X=l=>(l+180)/360*W,Y=a=>(90-a)/180*H;
const feats=topojson.feature(topo,topo.objects.countries).features;
const path=(f)=>{const ps=f.geometry.type==='Polygon'?[f.geometry.coordinates]:f.geometry.coordinates;g2.beginPath();for(const poly of ps)for(const ring of poly){ring.forEach(([lo,la],i)=>i?g2.lineTo(X(lo),Y(la)):g2.moveTo(X(lo),Y(la)));g2.closePath()}};
feats.forEach((f,i)=>{const h=(i*47)%5;g2.fillStyle=['#37a85a','#43b865','#2f9a50','#4cc26a','#3aae5e'][h];path(f);g2.fill('evenodd')});
g2.lineJoin='round';g2.lineCap='round';g2.strokeStyle='rgba(214,255,212,.9)';g2.lineWidth=2.2;
feats.forEach(f=>{const ps=f.geometry.type==='Polygon'?[f.geometry.coordinates]:f.geometry.coordinates;g2.beginPath();for(const poly of ps)for(const ring of poly)for(let i=1;i<ring.length;i++){const [x0,y0]=ring[i-1],[x1,y1]=ring[i];if(Math.abs(x1-x0)>170||(y0<-89.5&&y1<-89.5)||(Math.abs(x0)>179.9&&Math.abs(x1)>179.9&&x0*x1>0))continue;g2.moveTo(X(x0),Y(y0));g2.lineTo(X(x1),Y(y1))}g2.stroke()});
const tx=new T.CanvasTexture(cx);tx.anisotropy=8;tx.colorSpace=T.SRGBColorSpace;
grp.add(new T.Mesh(new T.SphereGeometry(1.003,96,64),new T.MeshBasicMaterial({map:tx})));
const pinMeshes=[];
PINS.forEach(p=>{const m=new T.Mesh(new T.SphereGeometry(.03,12,8),new T.MeshBasicMaterial({color:COL[p.tag]||0xffffff}));m.position.copy(ll2v(p.ll[0],p.ll[1],1.02));m.userData=p;m.visible=false;grp.add(m);pinMeshes.push(m)});
grp.rotation.y=-1.0;grp.rotation.x=.3;
function size(){const w=cv.clientWidth,h=cv.clientHeight;r.setSize(w,h,false);cam.aspect=w/h;cam.updateProjectionMatrix()}addEventListener('resize',size);size();
let drag=false,lx=0,ly=0,vy=.0016,t0=0;
cv.addEventListener('pointerdown',e=>{drag=true;lx=e.clientX;ly=e.clientY;cv.style.cursor='grabbing'});
addEventListener('pointerup',()=>{drag=false;cv.style.cursor='grab'});
addEventListener('pointermove',e=>{if(drag){grp.rotation.y+=(e.clientX-lx)*.006;grp.rotation.x=Math.max(-1.2,Math.min(1.2,grp.rotation.x+(e.clientY-ly)*.006));lx=e.clientX;ly=e.clientY}});
function flyTo(ll){const tgt=Math.PI/2-(ll[1]+180)*Math.PI/180;let d=((tgt-grp.rotation.y)%(2*Math.PI)+3*Math.PI)%(2*Math.PI)-Math.PI;grp.userData.fy=grp.rotation.y+d;grp.userData.fx=ll[0]*Math.PI/180*.8}
const yr=document.getElementById('yr'),stage=document.getElementById('stage'),era=document.getElementById('era'),srcBox=document.getElementById('src');
let dec=1990,labels=[];const near=d=>DECS.reduce((b,x)=>Math.abs(x-d)<Math.abs(b-d)?x:b,DECS[0]);
const esc=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function step(k){const i=DECS.indexOf(dec)+k;setDec(DECS[Math.max(0,Math.min(DECS.length-1,i))])}
function setDec(d){d=near(Math.floor((+d||dec)/10)*10);dec=d;yr.value=d+'s';
 const now=PINS.filter(p=>p.y>=d&&p.y<d+10);era.textContent=now.length+(now.length===1?' event':' events')+' pinned';
 pinMeshes.forEach(m=>{m.visible=m.userData.y>=d&&m.userData.y<d+10});
 labels.forEach(l=>l.el.remove());
 labels=now.map(p=>{const el=document.createElement('div');el.className='lab';el.innerHTML=`<b>${esc(p.t)}</b><small>${esc(p.d)}${p.p?" · "+esc(p.p):""}</small><span class="more">${esc(p.x)}</span>`;stage.append(el);return {p,el}});
 srcBox.innerHTML='<h2>Sources, '+d+'s</h2>'+now.map(p=>`<div class="ev"><b>${esc(p.t)}</b> <small>${esc(p.d)} · ${esc(p.tag)}</small>${p.who?`<div class="cit">${esc(p.who)}</div>`:""}<p>${esc(p.x)}</p>${p.pin?`<div class="cit">Pin: ${esc(p.pin)}</div>`:""}`+p.s.map(q=>`<div class="cit">${esc(q.c)} <a href="${q.u}" target="_blank" rel="noopener">${esc(q.u)}</a></div>`).join('')+'</div>').join('')+'<p class="note">Entries are Dri\u2019s research notes; the sources listed support them (accessed November 22, 2026). Wikipedia text is licensed CC BY-SA 4.0 (creativecommons.org/licenses/by-sa/4.0/); other sources are linked for reference. Country borders shown are modern.</p>';
 if(now.length){let la=0,lo=0;now.forEach(p=>{la+=p.ll[0];lo+=p.ll[1]});flyTo([la/now.length,lo/now.length])}}
function commit(){setDec(yr.value.replace(/\D/g,'').slice(0,4))}
yr.addEventListener('focus',()=>yr.select());yr.addEventListener('change',commit);yr.addEventListener('keydown',e=>{if(e.key==='Enter'){commit();yr.blur()}});
document.getElementById('prev').onclick=()=>step(-1);document.getElementById('next').onclick=()=>step(1);
addEventListener('keydown',e=>{if(document.activeElement===yr)return;if(e.key==='ArrowLeft')step(-1);if(e.key==='ArrowRight')step(1)});
setDec(1990);
const ray=new T.Raycaster(),mv=new T.Vector2();
cv.addEventListener('pointermove',e=>{const b=cv.getBoundingClientRect();mv.set((e.clientX-b.left)/b.width*2-1,-(e.clientY-b.top)/b.height*2+1);ray.setFromCamera(mv,cam);const h=ray.intersectObjects(pinMeshes.filter(m=>m.visible))[0];if(h){tip.style.display='block';tip.style.left=e.clientX-b.left+12+'px';tip.style.top=e.clientY-b.top+12+'px';tip.textContent=h.object.userData.t+' · '+h.object.userData.y}else tip.style.display='none'});
const wp=new T.Vector3();
function placeLabels(){const w=cv.clientWidth,h=cv.clientHeight,vs=[];for(const o of labels){const m=pinMeshes.find(m=>m.userData===o.p);m.getWorldPosition(wp);const vis=wp.z>0.12;o.el.style.display=vis?'block':'none';if(!vis)continue;const v=wp.clone().project(cam);o.x=(v.x+1)/2*w;o.y=(1-v.y)/2*h;o.ly=o.y;vs.push(o)}
 vs.sort((a,b)=>a.y-b.y);let last=-1e9;for(const o of vs){const hh=o.el.offsetHeight||50;o.ly=Math.max(o.y,last+hh/2+8);last=o.ly+hh/2}
 for(const o of vs){const flip=o.x>w-250;o.el.style.left=o.x+'px';o.el.style.top=o.ly+'px';o.el.style.transform=flip?'translate(calc(-100% - 14px),-50%)':'translate(14px,-50%)'}}
(function loop(t){const f=(t||0)*.001;grp.position.y=Math.sin(f*1.1)*.035;
 if(grp.userData.fy!=null&&!drag){grp.rotation.y+=(grp.userData.fy-grp.rotation.y)*.06;grp.rotation.x+=(grp.userData.fx-grp.rotation.x)*.06;if(Math.abs(grp.userData.fy-grp.rotation.y)<.002)grp.userData.fy=null}
 else if(!drag)grp.rotation.y+=vy;
 r.render(scene,cam);placeLabels();requestAnimationFrame(loop)})();
</script></body></html>
